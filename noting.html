<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Noting</title>
<style>
  :root {
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f5;
    --color-background-tertiary: #ebebeb;
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #737373;
    --color-text-tertiary: #a3a3a3;
    --color-border-secondary: #e0e0e0;
    --color-border-tertiary: #ebebeb;
    --border-radius-md: 10px;
    --border-radius-lg: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #141414;
      --color-background-secondary: #222222;
      --color-background-tertiary: #2e2e2e;
      --color-text-primary: #f0f0f0;
      --color-text-secondary: #888888;
      --color-text-tertiary: #555555;
      --color-border-secondary: #333333;
      --color-border-tertiary: #2a2a2a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    -webkit-text-size-adjust: 100%;
  }

  #progress-track {
    position: fixed; top: 0; left: 0; width: 100%; height: 2px;
    background: transparent; z-index: 100;
  }
  #progress-fill {
    height: 100%; width: 0%;
    background: var(--color-border-secondary);
    transition: width 0.4s linear;
  }

  #app { padding: 1.5rem 1rem 1.25rem; max-width: 420px; margin: 0 auto; }

  .control-label {
    font-size: 11px; color: var(--color-text-secondary);
    margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .field-select {
    width: 100%; padding: 8px 10px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    font-size: 14px; font-family: var(--font-sans);
  }
  .num-input {
    width: 48px; min-width: 0; padding: 8px 4px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    font-size: 14px; text-align: center; font-family: var(--font-sans);
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .range { display: flex; gap: 6px; align-items: center; }
  .dash { color: var(--color-text-secondary); font-size: 13px; flex-shrink: 0; }
  .caption { font-size: 11px; color: var(--color-text-tertiary); margin-top: 6px; }

  /* The pad. During a session it carries the count and nothing else — no
     progress ring, no pace, no encouragement. The ear keeps the rhythm; the
     eye is only there for the number, and only when it looks. */
  #pad {
    width: 100%;
    height: min(75vw, 320px);
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    background: var(--color-background-secondary);
    transition: background 0.35s ease;
  }
  #pad.active { background: var(--color-background-tertiary); }
  /* The tap flash is deliberately faint and brief: acknowledgement, not
     reward. The reward is the chime, and it only comes every nth note. */
  #pad.flash { background: var(--color-background-secondary); transition: none; }

  #pad-icon { font-size: 26px; line-height: 1; color: var(--color-text-tertiary); }
  #pad-count {
    display: none;
    font-size: clamp(56px, 22vw, 96px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-weight: 300;
    letter-spacing: -0.02em;
  }
  #pad.running #pad-count { display: block; }
  #pad.running #pad-icon { display: none; }
  #pad-text {
    font-size: 15px; font-weight: 400;
    color: var(--color-text-secondary);
    margin-top: 10px; letter-spacing: 0.01em; text-align: center;
    padding: 0 1.5rem;
  }
  /* Cycle dots: how far through the current chime group this note sits.
     Visible only if you look — the information is really in the rising pitch. */
  #cycle { display: none; gap: 6px; margin-top: 14px; }
  #pad.running #cycle { display: flex; }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--color-border-secondary);
    transition: background 0.2s ease;
  }
  .dot.on { background: var(--color-text-tertiary); }

  .btn {
    border: 0.5px solid var(--color-border-secondary);
    background: transparent;
    color: var(--color-text-primary);
    border-radius: var(--border-radius-md);
    padding: 10px 20px; font-size: 14px; cursor: pointer;
    font-family: var(--font-sans);
  }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-small { padding: 8px 12px; font-size: 13px; color: var(--color-text-secondary); }

  #summary { display: none; margin-top: 1.25rem; }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--color-border-tertiary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md); overflow: hidden;
  }
  .stat { background: var(--color-background-primary); padding: 12px 14px; }
  .stat-label {
    font-size: 10px; color: var(--color-text-secondary);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .stat-value { font-size: 20px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .stat-unit { font-size: 12px; color: var(--color-text-secondary); margin-left: 2px; }

  #trace-wrap { margin-top: 1rem; }
  #trace { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin-top: 8px; }
  .bar { flex: 1; min-width: 2px; background: var(--color-border-secondary); border-radius: 1px; }
  .bar.gap { background: var(--color-text-tertiary); }

  #lifetime {
    margin-top: 1.5rem; padding-top: 1rem;
    border-top: 0.5px solid var(--color-border-tertiary);
    font-size: 11px; color: var(--color-text-tertiary);
    display: flex; justify-content: space-between;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }
</style>
</head>
<body>
<div id="progress-track"><div id="progress-fill"></div></div>

<div id="app">
  <h1 class="sr-only">Noting</h1>

  <div id="controls" style="margin-bottom: 1.25rem;">
    <div class="row" style="margin-bottom: 10px;">
      <div style="flex: 1.2;">
        <div class="control-label">Session</div>
        <select id="target-select" class="field-select">
          <option value="open">Open — no end</option>
          <optgroup label="By notes">
            <option value="n:54">54 notes</option>
            <option value="n:108" selected>108 notes</option>
            <option value="n:216">216 notes</option>
            <option value="n:324">324 notes</option>
            <option value="n:540">540 notes</option>
            <option value="n:1080">1080 notes</option>
          </optgroup>
          <optgroup label="By time">
            <option value="t:5">5 min</option>
            <option value="t:10">10 min</option>
            <option value="t:15">15 min</option>
            <option value="t:20">20 min</option>
            <option value="t:30">30 min</option>
            <option value="t:45">45 min</option>
            <option value="t:60">60 min</option>
          </optgroup>
        </select>
      </div>
      <div style="flex: 1;">
        <div class="control-label">Chime / count</div>
        <div class="range">
          <input type="number" id="chime-every" min="1" max="12" value="3" class="num-input">
          <span class="dash">×</span>
          <input type="number" id="chimes-per-call" min="1" max="12" value="3" class="num-input">
        </div>
      </div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
      <div style="flex: 1;">
        <div class="control-label">Every tap</div>
        <select id="tap-select" class="field-select">
          <option value="soft" selected>Soft note</option>
          <option value="climb">Climbing</option>
          <option value="off">Silent</option>
        </select>
      </div>
      <div style="flex: 1;">
        <div class="control-label">Count</div>
        <select id="voice-select" class="field-select">
          <option value="spoken" selected>Spoken</option>
          <option value="tones">Struck</option>
          <option value="chord">Chord only</option>
        </select>
      </div>
    </div>
    <div class="caption" id="scheme-caption"></div>
    <div class="caption" id="speech-status" style="display: none;"></div>
    <div id="speech-test-wrap" style="display: none; margin-top: 8px;">
      <button class="btn btn-small" id="speech-test">Test voice</button>
      <span id="speech-heard" style="display: none; margin-left: 8px;">
        <button class="btn btn-small" id="heard-yes">I heard it</button>
        <button class="btn btn-small" id="heard-no">Nothing</button>
      </span>
      <div class="caption" id="speech-diag" style="display: none; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; line-height: 1.5;"></div>
    </div>
    <div class="caption" id="wake-status" style="display: none;"></div>
  </div>

  <div id="pad">
    <div id="pad-icon">◉</div>
    <div id="pad-count">0</div>
    <div id="pad-text">Tap once for every note.</div>
    <div id="cycle"></div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
    <button class="btn" id="start-btn">Begin</button>
    <button class="btn btn-small" id="undo-btn" disabled>Undo</button>
    <button class="btn" id="stop-btn" disabled>End session</button>
  </div>

  <div id="summary">
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-label">Notes</div>
        <div class="stat-value"><span id="s-notes">—</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Duration</div>
        <div class="stat-value"><span id="s-dur">—</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Pace — median</div>
        <div class="stat-value"><span id="s-pace">—</span><span class="stat-unit">/min</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Longest gap</div>
        <div class="stat-value"><span id="s-gap">—</span><span class="stat-unit">s</span></div>
      </div>
    </div>
    <div id="trace-wrap">
      <div class="control-label">Interval between notes</div>
      <div id="trace"></div>
      <div class="caption" id="trace-caption"></div>
    </div>
  </div>

  <div id="lifetime">
    <span id="lt-notes"></span>
    <span id="lt-sessions"></span>
  </div>
</div>

<script>
// ─── Wake lock ────────────────────────────────────────────────────────────────
//
// A single request at the start of a session is not enough. The system takes
// the lock back on its own — on a call, on a notification, on any moment the
// tab stops being frontmost — and it never gives it back unasked. The old code
// only re-requested on visibilitychange, so one interruption ended the lock
// for the rest of the sitting.
//
// So: hold an intention (`wantAwake`) rather than a handle, and reassert it
// from every angle that could plausibly have lost it — the lock's own release
// event, visibility, focus, pageshow, every tap, and a watchdog that checks
// twice a minute regardless. Re-requesting a lock that is already held is
// cheap and idempotent.

let wakeLock = null;
let wantAwake = false;
let wakeWatchdog = null;

function wakeSupported() { return 'wakeLock' in navigator; }

async function acquireWakeLock() {
  if (!wantAwake || !wakeSupported()) return;
  if (document.visibilityState !== 'visible') return;   // the request would only reject
  if (wakeLock && !wakeLock.released) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    // Fires whenever the system takes it back. This is the event the old
    // version was missing.
    wakeLock.addEventListener('release', () => { if (wantAwake) setTimeout(acquireWakeLock, 300); });
    setWakeStatus(true);
  } catch(e) {
    wakeLock = null;
    setWakeStatus(false, e && e.name === 'NotAllowedError'
      ? 'Screen lock refused — Low Power Mode blocks it on iOS.'
      : 'Could not hold the screen awake.');
  }
}

function startWakeLock() {
  wantAwake = true;
  if (!wakeSupported()) {
    setWakeStatus(false, 'This browser cannot hold the screen awake — set Auto-Lock to Never.');
    return;
  }
  acquireWakeLock();
  clearInterval(wakeWatchdog);
  wakeWatchdog = setInterval(acquireWakeLock, 30000);
}

function stopWakeLock() {
  wantAwake = false;
  clearInterval(wakeWatchdog);
  wakeWatchdog = null;
  try { if (wakeLock && !wakeLock.released) wakeLock.release(); } catch(e) {}
  wakeLock = null;
  setWakeStatus(null);
}

['visibilitychange', 'focus', 'pageshow', 'resume'].forEach(evt => {
  const t = evt === 'visibilitychange' ? document : window;
  t.addEventListener(evt, () => { if (wantAwake) acquireWakeLock(); });
});

// Shown only when the lock is not held: silence would look identical to
// working, and the failure costs a sitting.
function setWakeStatus(held, msg) {
  const el = document.getElementById('wake-status');
  if (!el) return;
  if (held === null || held === true) { el.style.display = 'none'; el.textContent = ''; return; }
  el.textContent = msg || 'Screen may lock.';
  el.style.display = 'block';
}

// ─── Audio ────────────────────────────────────────────────────────────────────
//
// One bell per chime, struck with inharmonic partials and a long exponential
// tail through a small reverb. The tail matters more than the strike: a note
// that keeps ringing after the tap is what makes the interval feel spacious
// rather than metronomic.

let audioCtx = null;
let cachedIR = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Safari suspends or 'interrupts' the context on its own — after a phone
    // call, a lock, a route change. Left alone it stays down, which is why a
    // tap could land in silence.
    audioCtx.addEventListener?.('statechange', () => {
      if (audioCtx.state !== 'running' && keepAliveOn) audioCtx.resume().catch(() => {});
    });
  }
  return audioCtx;
}

// ─── Keeping the audio hardware awake ─────────────────────────────────────────
//
// The "sound fading in halfway" was the audio device powering down between
// notes and having to spin back up on the next one — the first tens of
// milliseconds of a chime were being eaten by the wake-up. iOS is aggressive
// about this: with nothing playing, the audio session goes idle within
// seconds, and noting leaves long gaps by design.
//
// The fix is to never actually stop: an inaudible noise floor plays for the
// whole session, so the hardware is always already running when a chime
// arrives. It is about -80 dB — far below anything audible, but not digital
// zero, which some devices optimise away as silence.

let keepAliveSrc = null;
let keepAliveOn = false;

function startKeepAlive() {
  const ctx = getAudioCtx();
  keepAliveOn = true;
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  if (keepAliveSrc) return;
  const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const g = ctx.createGain();
  g.gain.value = 0.0001;
  g.connect(ctx.destination);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  src.connect(g);
  src.start();
  keepAliveSrc = { src, g };
}

function stopKeepAlive() {
  keepAliveOn = false;
  if (!keepAliveSrc) return;
  try { keepAliveSrc.src.stop(); keepAliveSrc.src.disconnect(); keepAliveSrc.g.disconnect(); } catch(e) {}
  keepAliveSrc = null;
}

// Belt and braces: every tap is a gesture, and a gesture is the one moment a
// suspended context is always allowed to come back.
function ensureAudioAwake() {
  const ctx = getAudioCtx();
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  if (keepAliveOn && !keepAliveSrc) startKeepAlive();
}

document.addEventListener('visibilitychange', () => {
  if (keepAliveOn && document.visibilityState === 'visible') ensureAudioAwake();
});

function getReverbIR(ctx) {
  if (cachedIR) return cachedIR;
  const duration = 2.2;
  const rate = ctx.sampleRate;
  const length = Math.max(1, Math.floor(rate * duration));
  const ir = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = ir.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      const t = i / length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3);
    }
  }
  cachedIR = ir;
  return ir;
}

// Partial ratios and their relative weights. Real struck metal is inharmonic;
// exact integer partials sound like a synthesiser and stop being pleasant
// after the two-hundredth repetition.
// Attacks are slower than they were. A 4 ms attack on four partials at once is
// a transient with real energy in it — that edge, not the level alone, was
// what made the chime feel like it cut across the practice. The lowpasses came
// down for the same reason: the glare lives in the top partials.
//
// Everything is wood now, and there is no picker. One material for the whole
// session means the chime is recognisably the same object as the tap, only
// struck harder — which is what makes a group of three read as one gesture
// rather than as three taps plus an unrelated bell.
//
// The two voices share their partial ratios exactly; that ratio set is the
// timbre, the thing the ear identifies as "wood". They differ only in how long
// they ring and how much room is around them. `tap` is a dry block. `chime` is
// the same block hollow and further away: the upper partials are held longer
// so it sings instead of clicking, and the reverb puts it at a distance.
const WOOD_RATIOS = [[1, 1.0], [2.76, 0.30], [5.40, 0.14]];
const WOOD_SUM = WOOD_RATIOS.reduce((s, p) => s + p[1], 0);

const TONE_VOICES = {
  tap:   { partials: WOOD_RATIOS.map(([r, a], i) => [r, a, [1.0, 0.30, 0.16][i]]),
           decay: 0.55, attack: 0.006, wet: 0.16, lp: 3200 },
  chime: { partials: WOOD_RATIOS.map(([r, a], i) => [r, a, [1.0, 0.48, 0.28][i]]),
           decay: 1.55, attack: 0.012, wet: 0.34, lp: 2600 },
};

// Everything struck is a chime-voice wood except where noted.
const VOICE = 'chime';

// Partial weights are normalised so they sum to 1. Without this the `gain`
// argument meant something different for every voice — a bell asking for 0.13
// was actually peaking near 0.23, since its four partials add up, while the
// single-sine tap asking for 0.115 got 0.115. That mismatch is why the chime
// stayed loud next to the tap however far the numbers came down. Now a gain of
// 0.1 means the same loudness whatever is making the sound.
Object.values(TONE_VOICES).forEach(v => {
  const total = v.partials.reduce((sum, p) => sum + p[1], 0);
  v.partials = v.partials.map(([ratio, amp, dec]) => [ratio, amp / total, dec]);
});

function strike(freq, gain, when, voiceKey) {
  const ctx = getAudioCtx();
  const v = TONE_VOICES[voiceKey] || TONE_VOICES.chime;
  const t0 = (when === undefined ? ctx.currentTime : when) + 0.001;

  const bus = ctx.createGain();
  bus.gain.value = gain;

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = v.lp;
  bus.connect(lp);

  const dry = ctx.createGain();
  dry.gain.value = 1 - v.wet;
  lp.connect(dry);
  dry.connect(ctx.destination);

  const conv = ctx.createConvolver();
  conv.buffer = getReverbIR(ctx);
  const wet = ctx.createGain();
  wet.gain.value = v.wet;
  lp.connect(conv);
  conv.connect(wet);
  wet.connect(ctx.destination);

  let longest = 0;
  v.partials.forEach(([ratio, amp, decayScale]) => {
    const dur = v.decay * decayScale;
    longest = Math.max(longest, dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(amp, t0 + v.attack);
    // Exponential decay to near-silence, then a hard zero so nothing lingers
    // in the graph. setTargetAtTime gives the natural die-away shape.
    g.gain.setTargetAtTime(0.0001, t0 + v.attack, dur / 4);
    g.connect(bus);

    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * ratio, t0);
    o.connect(g);
    o.start(t0);
    o.stop(t0 + dur + 0.2);
    o.onended = () => { try { g.disconnect(); o.disconnect(); } catch(e) {} };
  });

  setTimeout(() => {
    try { bus.disconnect(); lp.disconnect(); dry.disconnect(); wet.disconnect(); conv.disconnect(); } catch(e) {}
  }, (longest + 2.8) * 1000);
}

// A pentatonic scale has no semitone to grate against anything else, so any
// two of these notes overlapping in the reverb tail still agree.
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51,
               1567.98, 1760.00, 2093.00, 2349.32];

// The chime for the kth group inside a cycle. The pitch climbs step by step
// toward the count, so the approach to the next spoken number is audible
// before it arrives — that is the whole feedback loop, and it costs no
// attention to read.
function playChime(stepIndex, stepsTotal) {
  const i = Math.min(stepIndex, SCALE.length - 1);
  // Now normalised against the tap, and deliberately below it: a bell rings
  // for two seconds where the tap is gone in a tenth of one, so equal peaks
  // are nowhere near equal loudness to the ear. The tail is what makes it the
  // larger event; it does not need the level as well.
  const t = stepsTotal > 1 ? stepIndex / (stepsTotal - 1) : 1;
  strike(SCALE[i], 0.070 + 0.028 * t, undefined, VOICE);
}

// ─── The tap itself ───────────────────────────────────────────────────────────
//
// Every note now answers. This is the layer that carries the practice: a small
// dry sound, quiet enough to sit under the chimes, arriving the instant the
// finger lands so the loop between noting and hearing is as short as it can
// be. Everything above it — chime, chord, count — is punctuation on top.
//
// 'climb' walks the tap pitch up through the group, so where you are inside
// the current three (or nine, or whatever) is audible on every single note
// rather than only when the chime arrives.

const TAP_BASE = 392.00;                                    // G4
const TAP_CLIMB = [329.63, 392.00, 440.00, 523.25, 587.33,  // pentatonic ascent
                   659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98];

function playTap(mode, indexInGroup, groupSize) {
  if (mode === 'off') return;
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime + 0.001;

  let freq = TAP_BASE;
  if (mode === 'climb') {
    freq = TAP_CLIMB[Math.min(indexInGroup, TAP_CLIMB.length - 1)];
  }

  // Short and slightly woody. A sine alone reads as a beep at this rate of
  // repetition; a touch of the third partial gives it a body that survives
  // hundreds of repeats without becoming irritating.
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  // Close to the chime rather than far under it. A tap that whispers while the
  // chime rings out makes every third note feel like an interruption; sitting
  // them nearly level turns the chime into an accent within one sound world.
  g.gain.exponentialRampToValueAtTime(mode === 'climb' ? 0.105 : 0.115, t0 + 0.005);
  g.gain.setTargetAtTime(0.0001, t0 + 0.005, 0.048);

  // Same ceiling the struck wood has, so the third partial adds body rather
  // than glare — it lands above 8 kHz on the top climb notes without this.
  const tapLp = ctx.createBiquadFilter();
  tapLp.type = 'lowpass';
  tapLp.frequency.value = TONE_VOICES.tap.lp;
  g.connect(tapLp);
  tapLp.connect(ctx.destination);

  // The same partial ratios and weights the struck voices use, normalised so
  // the gain above is a true peak and the two can be compared honestly. Sharing
  // the ratios is what makes the tap and the chime hear as one instrument.
  WOOD_RATIOS.map(([r, a]) => [r, a / WOOD_SUM]).forEach(([ratio, amp]) => {
    const vg = ctx.createGain();
    vg.gain.value = amp;
    vg.connect(g);
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * ratio, t0);
    o.connect(vg);
    o.start(t0);
    o.stop(t0 + 0.45);
    o.onended = () => { try { o.disconnect(); vg.disconnect(); } catch(e) {} };
  });
  setTimeout(() => { try { g.disconnect(); tapLp.disconnect(); } catch(e) {} }, 700);
}

// The count landing: one gentle chord, root–fourth–fifth, struck together.
// The climbing chimes are all single notes high in the scale, so a low, wide,
// simultaneous voicing reads as arrival rather than as another step. Each
// voice is quieter than a single chime — four notes at once is already louder
// than one, and the moment should settle, not announce.
const CHORD_145 = [130.81, 174.61, 196.00, 261.63];   // C3 · F3 · G3 · C4

function playMilestone() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  CHORD_145.forEach((f, i) => {
    // A few milliseconds of spread — below the ~30 ms where the ear starts
    // hearing an arpeggio, but enough to keep the attacks from stacking into
    // one hard transient.
    strike(f, 0.085, t0 + i * 0.008, VOICE);
  });
}

// End of session: the sus chord first, then the resolution. Only the fourth
// moves — F down to E — everything else is held, so the second chord lands as
// a settling rather than as a second event. The suspension is what makes the
// ending sound like an ending; a single chord, however gentle, just stops.
const CHORD_SUS  = [65.41, 130.81, 174.61, 196.00, 261.63];  // C2 · C3 · F3 · G3 · C4
const CHORD_TRIAD= [65.41, 130.81, 164.81, 196.00, 261.63];  // C2 · C3 · E3 · G3 · C4

function playEndChime() {
  const ctx = getAudioCtx();
  const t0 = ctx.currentTime;
  CHORD_SUS.forEach((f, i) => {
    strike(f, i === 0 ? 0.06 : 0.075, t0 + i * 0.010, VOICE);
  });
  // Quieter on the resolution: the first chord is still ringing under it, and
  // the ear only needs to hear the fourth give way.
  // Wood dies away faster than the old bell did, so the resolution comes
  // sooner — much later and the suspension it is resolving would already be
  // gone, and the second chord would sound like a separate event.
  CHORD_TRIAD.forEach((f, i) => {
    strike(f, i === 0 ? 0.04 : 0.05, t0 + 1.45 + i * 0.010, VOICE);
  });
}

// ─── The count, told in tones ─────────────────────────────────────────────────
//
// Speech is back as an option, but it cannot be relied on — iOS discards
// utterances that don't originate in a gesture, and every browser on the phone
// is WebKit. So the struck version below is kept as the thing speech falls
// back to, not as a discarded first attempt.
//
// The number is struck like a clock. Each decimal place has its own
// pitch, and the digit is how many times that pitch sounds:
//
//     thousands  C2   very low
//     hundreds   C3   low
//     tens       G4   middle
//     units      C6   high
//
// Because the place lives in the pitch rather than in the position, a zero
// simply doesn't sound and nothing is ambiguous: 108 is one low and eight
// high, while 18 is one middle and eight high. You never have to track which
// group you're in — the pitch tells you, whenever you happen to tune in.
//
// The pips are deliberately drier and shorter than the bells. Eight strikes of
// a 2-second bell is a cloud; eight of these is countable without effort.

const PLACE_PITCH = [783.99, 392.00, 130.81, 65.41];   // units, tens, hundreds, thousands
const PLACE_GAIN  = [0.05, 0.058, 0.07, 0.07];
const PIP_SPACING  = 0.092;   // within a digit — twice the old rate
const PLACE_GAP    = 0.30;    // extra silence between places
const COUNT_DELAY  = 1.15;    // after the chord's attack has passed

// A soft, dry ping. Three things keep it from sounding harsh: a pure sine with
// no bright partial above it, an attack slow enough to have no click in it,
// and a top an octave lower than it used to be — the old units pitch sat at
// C6, right where the ear is most easily hurt.
//
// The decay is short to match the faster rate: at this spacing a long tail
// would smear one pip into the next and the count would stop being countable.
function pip(freq, gain, when) {
  const ctx = getAudioCtx();
  const t0 = when;

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.setTargetAtTime(0.0001, t0 + 0.012, 0.030);

  // Rounds off whatever edge the envelope leaves.
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = Math.max(1400, freq * 2.2);
  g.connect(lp);
  lp.connect(ctx.destination);

  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t0);
  o.connect(g);
  o.start(t0);
  o.stop(t0 + 0.35);
  o.onended = () => { try { o.disconnect(); g.disconnect(); lp.disconnect(); } catch(e) {} };
}

// How long the whole count will take to strike, in ms — used so the end of a
// session waits for the number rather than cutting across it.
function countToneDuration(n) {
  let t = COUNT_DELAY;
  String(Math.min(n, 9999)).split('').forEach(d => {
    const digit = Number(d);
    if (digit) t += digit * PIP_SPACING + PLACE_GAP;
  });
  return t * 1000;
}

// Highest place first, the way a number is read.
function playCountTones(n) {
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const digits = String(Math.min(n, 9999)).split('').map(Number);
  const places = digits.length;
  let t = ctx.currentTime + COUNT_DELAY;

  digits.forEach((digit, i) => {
    const place = places - 1 - i;          // 0 = units
    if (digit === 0) return;               // a zero is silence; the pitch disambiguates
    const freq = PLACE_PITCH[Math.min(place, PLACE_PITCH.length - 1)];
    const gain = PLACE_GAIN[Math.min(place, PLACE_GAIN.length - 1)];
    for (let k = 0; k < digit; k++) {
      pip(freq, gain, t);
      t += PIP_SPACING;
    }
    t += PLACE_GAP;
  });
}

// ─── The count, spoken ────────────────────────────────────────────────────────
//
// Two hard facts about iOS govern everything here, and both were learned the
// expensive way:
//
// 1. Apple does not enable the Web Speech API in WKWebView. Every browser on
//    iOS that isn't Safari — Chrome, Firefox, Edge — is WKWebView, so there
//    `speechSynthesis` is not broken, it is absent. No amount of code fixes
//    that; the only fix is opening the page in Safari, so the app says so
//    rather than failing quietly.
//
// 2. WebKit drops any utterance that does not originate inside a user gesture,
//    silently, with no error event. The earlier version of this deferred the
//    count with setTimeout so it would land after the chord — which took it
//    out of the gesture and guaranteed it would never speak on iOS, Safari
//    included. So speech now happens synchronously inside the tap that
//    completed the count. That is why there is no delay before it, and why
//    nothing in this path may be made async.
//
// The other thing to be plain about: the engine writes straight to system
// output, so no reverb or filter can reach it. Volume, rate and pitch are all
// the softening available — and iOS ignores volume on many versions, so on a
// phone it may simply arrive at system level. If it is too present, the struck
// count is the genuinely quiet option.

const SPEECH_VOLUME = 0.30;
const SPEECH_RATE   = 0.82;
const SPEECH_PITCH  = 0.80;

let speechDead = false;
let speechReason = '';
let chosenVoice = null;

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// Safari on iOS is the only iOS browser with speech. The others identify
// themselves in the UA even though they are all WebKit underneath.
const IS_IOS_NON_SAFARI = IS_IOS && /CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(navigator.userAgent);

function speechSupported() {
  return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
}

// Fuller voices carry better at low volume; compact ones get thin and sibilant
// when turned down. Not applied on iOS: assigning a voice object there is one
// of the known ways an utterance goes silent, and the default is good anyway.
function pickVoice() {
  if (IS_IOS) return null;
  if (chosenVoice) return chosenVoice;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;                    // not loaded yet; try again next call
  const en = voices.filter(v => /^en/i.test(v.lang));
  const pool = en.length ? en : voices;
  const preferred = ['Daniel', 'Serena', 'Samantha', 'Karen', 'Moira', 'Google UK'];
  for (const name of preferred) {
    const hit = pool.find(v => v.name.indexOf(name) !== -1);
    if (hit) { chosenVoice = hit; return chosenVoice; }
  }
  chosenVoice = pool.find(v => v.localService) || pool[0];
  return chosenVoice;
}

if (speechSupported() && typeof window.speechSynthesis.addEventListener === 'function') {
  window.speechSynthesis.addEventListener('voiceschanged', () => { chosenVoice = null; pickVoice(); });
}

function setSpeechStatus(msg) {
  const el = document.getElementById('speech-status');
  if (!el) return;
  el.textContent = msg || '';
  el.style.display = msg ? '' : 'none';
}

function markSpeechDead(reason) {
  if (speechDead) return;
  speechDead = true;
  speechReason = reason;
  setSpeechStatus(reason + ' Counting in struck tones instead.');
}

// Called when the count mode is chosen and again at Begin, so the limitation
// is known before a session rather than discovered in the middle of one.
function checkSpeechAvailability() {
  if (countMode !== 'spoken') { if (!speechDead) setSpeechStatus(''); return; }
  if (IS_IOS_NON_SAFARI) {
    markSpeechDead('Apple only allows the speech API in Safari, so the count cannot be spoken in this browser — open this page in Safari for the spoken count.');
  } else if (!speechSupported()) {
    markSpeechDead('This browser has no speech support.');
  } else if (speechDead) {
    setSpeechStatus(speechReason + ' Counting in struck tones instead.');
  } else {
    setSpeechStatus('');
  }
}

// MUST be called synchronously from within the tap handler — see note 2 above.
// Nothing here may be deferred, awaited, or wrapped in a timer.
function speakCount(n) {
  if (speechDead || !speechSupported()) { playCountTones(n); return; }

  let started = false;
  let u;
  try {
    u = new SpeechSynthesisUtterance(String(n));
  } catch(e) { markSpeechDead('Speech could not be started.'); playCountTones(n); return; }

  applyStrategy(u, speechStrategy);
  beforeSpeech(speechStrategy);
  u.onstart = () => { started = true; };
  u.onend   = () => afterSpeech(speechStrategy);
  u.onerror = e => {
    afterSpeech(speechStrategy);
    if (started) return;
    // 'interrupted' and 'canceled' are our own doing, not a broken engine.
    if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
    markSpeechDead('Speech failed on this device.');
    playCountTones(n);
  };

  try {
    // A previous count still talking is the one case worth cancelling: WebKit
    // queues rather than replaces, so without this a slow speaker would fall
    // further behind the practice with every call. Cancelling unconditionally
    // is avoided — that is one of the ways the engine gets wedged.
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
    }
    window.speechSynthesis.speak(u);
  } catch(e) { markSpeechDead('Speech could not be started.'); playCountTones(n); return; }

  // Silence with no error is exactly how WebKit refuses. Give it a moment,
  // then tell the number the other way.
  setTimeout(() => {
    if (started) return;
    afterSpeech(speechStrategy);
    // The reduced volume is the newest thing here and the likeliest culprit,
    // so give that up before giving up on speech altogether.
    if (gainAllowed && !speechStrategy.soften) dropSpeechGain();
    else markSpeechDead('Speech stayed silent on this device — try the Test voice button.');
    playCountTones(n);
  }, 1200);
}

// How long to hold the session open for the final count. Once speech has been
// ruled out the struck timing is exact; while it is still live, allow enough
// for a four-digit number at this rate plus the silence check.
function spokenCountDuration(n) {
  if (speechDead || !speechSupported()) return countToneDuration(n);
  return 2400;
}

// ─── Why speech might still be silent, asked rather than guessed ──────────────
//
// Safari on iOS has the API and still says nothing, so something on the device
// is refusing it. The candidates are all plausible and mutually exclusive, so
// rather than shipping a guess the app tries them one at a time and keeps
// whichever works:
//
//   plain    nothing touched at all. Some iOS versions go silent if volume is
//            set below 1 — our softening would be the very thing breaking it.
//   soft     our volume/rate/pitch. If plain works and this doesn't, that's
//            the answer and the count simply can't be softened here.
//   noloop   the silent keep-alive buffer stopped. It holds the audio session
//            open for the whole session, and WebKit's speech needs that
//            session too.
//   noaudio  the whole AudioContext suspended. Same theory, harder.
//
// Each trial runs from its own tap. That matters: WebKit only honours speech
// inside a user gesture, so chaining trials on timers would make every one
// after the first fail for a reason that has nothing to do with what's being
// tested.
//
// `onstart` firing only means the engine accepted it — the ring/silent switch
// can still mute it downstream, and that is invisible to script. So the user
// is asked what they actually heard, and the two answers mean different things.

const SPEECH_TRIALS = [
  { id: 'plain',   label: 'plain, nothing touched',   soften: false, quiet: false, suspend: false },
  { id: 'soft',    label: 'softened volume/rate/pitch', soften: true,  quiet: false, suspend: false },
  { id: 'noloop',  label: 'keep-alive stopped',       soften: false, quiet: true,  suspend: false },
  { id: 'noaudio', label: 'audio fully suspended',    soften: false, quiet: true,  suspend: true  },
];

const LS_STRATEGY = 'noting-speech-strategy-v1';
let trialIndex = 0;
let speechStrategy = SPEECH_TRIALS[0];

try {
  const saved = localStorage.getItem(LS_STRATEGY);
  const hit = SPEECH_TRIALS.find(t => t.id === saved);
  if (hit) speechStrategy = hit;
} catch(e) {}

// If the working method needs the audio silenced, the chord can't be struck on
// the same tap — it would be the very thing drowning the voice out.
function speechWantsSilence() {
  return countMode === 'spoken' && !speechDead && speechStrategy.suspend;
}

// A quarter down from full. Applied on top of whichever method won, including
// 'plain' — but 'plain' won precisely because it touches nothing, and a volume
// below 1 is one of the things suspected of silencing iOS speech in the first
// place. So this is provisional: if a count goes silent while it is on, the
// reduction is dropped and never tried again. A voice that works is worth more
// than a voice at the right level.
const SPEECH_GAIN = 0.75;
const LS_GAIN = 'noting-speech-gain-v1';
let gainAllowed = true;
try { if (localStorage.getItem(LS_GAIN) === 'off') gainAllowed = false; } catch(e) {}

function dropSpeechGain() {
  if (!gainAllowed) return;
  gainAllowed = false;
  try { localStorage.setItem(LS_GAIN, 'off'); } catch(e) {}
  setSpeechStatus('The count went silent at reduced volume, so it is back to full — this device will not take a quieter voice.');
}

function applyStrategy(u, s) {
  if (s.soften) {
    u.volume = SPEECH_VOLUME;
    u.rate   = SPEECH_RATE;
    u.pitch  = SPEECH_PITCH;
    const v = pickVoice();
    if (v) u.voice = v;
  } else if (gainAllowed) {
    // Otherwise leave rate, pitch and voice at their defaults — that is the
    // point of 'plain' — and take only the level down.
    u.volume = SPEECH_GAIN;
  }
}

function beforeSpeech(s) {
  if (s.quiet) stopKeepAlive();
  if (s.suspend && audioCtx && audioCtx.state === 'running') {
    try { audioCtx.suspend(); } catch(e) {}
  }
}

function afterSpeech(s) {
  if (!running) return;                 // session over; endSession handles the rest
  if (s.suspend && audioCtx) { try { audioCtx.resume(); } catch(e) {} }
  if (s.quiet) startKeepAlive();
}

function diagLine(extra) {
  const voices = speechSupported() ? (window.speechSynthesis.getVoices() || []).length : 0;
  const synth = !speechSupported() ? 'absent'
    : [window.speechSynthesis.speaking && 'speaking',
       window.speechSynthesis.pending  && 'pending',
       window.speechSynthesis.paused   && 'paused'].filter(Boolean).join(' ') || 'idle';
  return [
    'device : ' + (IS_IOS ? (IS_IOS_NON_SAFARI ? 'iOS, not Safari' : 'iOS Safari') : 'desktop or other'),
    'voices : ' + voices,
    'synth  : ' + synth,
    'audio  : ' + (audioCtx ? audioCtx.state : 'not started') + (keepAliveOn ? ' + keep-alive' : ''),
    extra
  ].filter(Boolean).join('\n');
}

function showDiag(text) {
  const el = document.getElementById('speech-diag');
  el.textContent = text;
  el.style.display = '';
}

function runSpeechTrial() {
  const s = SPEECH_TRIALS[trialIndex];
  const btn = document.getElementById('speech-test');
  const heard = document.getElementById('speech-heard');

  if (!speechSupported()) { showDiag(diagLine('result : no speech API at all')); return; }

  beforeSpeech(s);

  let started = false;
  let errored = '';
  const u = new SpeechSynthesisUtterance('twenty seven');
  applyStrategy(u, s);
  u.onstart = () => { started = true; };
  u.onerror = e => { errored = (e && e.error) || 'error'; };
  u.onend   = () => afterSpeech(s);

  try {
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch(e) {
    showDiag(diagLine('result : speak() threw — ' + e));
    afterSpeech(s);
    return;
  }

  showDiag(diagLine('trial  : ' + (trialIndex + 1) + '/' + SPEECH_TRIALS.length + ' — ' + s.label + '\nresult : waiting…'));

  setTimeout(() => {
    afterSpeech(s);
    const outcome = errored ? 'engine reported "' + errored + '"'
                  : started ? 'engine started speaking'
                  : 'engine never started — silently refused';
    showDiag(diagLine(
      'trial  : ' + (trialIndex + 1) + '/' + SPEECH_TRIALS.length + ' — ' + s.label +
      '\nresult : ' + outcome +
      (started ? '\n\nDid you actually hear it?' : '')
    ));
    if (started) {
      heard.style.display = '';
      btn.textContent = 'Test again';
    } else {
      heard.style.display = 'none';
      trialIndex = (trialIndex + 1) % SPEECH_TRIALS.length;
      btn.textContent = trialIndex === 0 ? 'Start over' : 'Try the next method';
    }
  }, 1600);
}

function speechHeard(yes) {
  const s = SPEECH_TRIALS[trialIndex];
  document.getElementById('speech-heard').style.display = 'none';
  if (yes) {
    speechStrategy = s;
    speechDead = false;
    speechReason = '';
    try { localStorage.setItem(LS_STRATEGY, s.id); } catch(e) {}
    setSpeechStatus('');
    showDiag('Using "' + s.label + '" for the spoken count.' +
      (s.soften ? '' : '\nThis method needs the voice at its default level, so it will not be softened.') +
      (s.suspend ? '\nThe chord is skipped on counts, so the voice is not competing with it.' : ''));
    document.getElementById('speech-test').textContent = 'Test voice';
    trialIndex = 0;
  } else {
    // The engine started but nothing came out: that is downstream of the API,
    // and it is nearly always the hardware switch.
    trialIndex = (trialIndex + 1) % SPEECH_TRIALS.length;
    document.getElementById('speech-test').textContent = 'Try the next method';
    showDiag(diagLine(
      'result : the engine started but you heard nothing.\n' +
      '\nThat is downstream of the browser, so no code change reaches it.\n' +
      'Check the silent/ring switch on the side of the phone, and the\n' +
      'volume while this page is in front — iOS keeps a separate level\n' +
      'for speech, and the chimes being audible does not mean it is up.'
    ));
  }
}

// ─── Session ──────────────────────────────────────────────────────────────────

let running = false;
let noteCount = 0;
let sessionStart = 0;
let tickTimer = null;
let target = { kind: 'open', value: 0 };
let chimeEvery = 3;
let chimesPerCall = 3;
let countMode = 'spoken';   // 'spoken' | 'tones' | 'chord'
let tapMode = 'soft';
const stamps = [];   // performance.now() of each note, in order

const padEl     = document.getElementById('pad');
const countEl   = document.getElementById('pad-count');
const textEl    = document.getElementById('pad-text');
const cycleEl   = document.getElementById('cycle');
const fillEl    = document.getElementById('progress-fill');
const startBtn  = document.getElementById('start-btn');
const stopBtn   = document.getElementById('stop-btn');
const undoBtn   = document.getElementById('undo-btn');
const summaryEl = document.getElementById('summary');

function readSettings() {
  chimeEvery   = clampInt(document.getElementById('chime-every').value, 1, 12, 3);
  chimesPerCall= clampInt(document.getElementById('chimes-per-call').value, 1, 12, 3);
  countMode    = document.getElementById('voice-select').value;
  tapMode      = document.getElementById('tap-select').value;
  const t = document.getElementById('target-select').value;
  if (t === 'open') target = { kind: 'open', value: 0 };
  else if (t.startsWith('n:')) target = { kind: 'notes', value: parseInt(t.slice(2), 10) };
  else target = { kind: 'time', value: parseInt(t.slice(2), 10) * 60 };
}

function clampInt(v, lo, hi, dflt) {
  const n = parseInt(v, 10);
  if (isNaN(n)) return dflt;
  return Math.min(hi, Math.max(lo, n));
}

function callEvery() { return chimeEvery * chimesPerCall; }

function syncCaption() {
  readSettings();
  const cap = document.getElementById('scheme-caption');
  let s = tapMode === 'off' ? '' : 'A note on every tap. ';
  s += `Chime every ${chimeEvery} ${chimeEvery === 1 ? 'note' : 'notes'}, `
     + `chord and count every ${callEvery()}.`;
  if (target.kind === 'notes') {
    const calls = Math.floor(target.value / callEvery());
    s += ` ${calls} call${calls === 1 ? '' : 's'} to ${target.value}.`;
    if (target.value % callEvery() !== 0) s += ` (${target.value} is not a multiple of ${callEvery()}.)`;
  }
  if (countMode === 'spoken') s += ' The count is spoken.';
  else if (countMode === 'tones') s += ' Count: low = hundreds, middle = tens, high = units.';
  cap.textContent = s;
  checkSpeechAvailability();
  document.getElementById('speech-test-wrap').style.display =
    countMode === 'spoken' && !IS_IOS_NON_SAFARI && speechSupported() ? '' : 'none';
  buildCycleDots();
}

function buildCycleDots() {
  cycleEl.innerHTML = '';
  for (let i = 0; i < chimesPerCall; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    cycleEl.appendChild(d);
  }
}

function paintCycleDots() {
  const chimesDone = Math.floor(noteCount / chimeEvery) % chimesPerCall;
  // At an exact call boundary the cycle has just completed — show it full for
  // the moment the number is spoken, then it clears on the next chime.
  const atCall = noteCount > 0 && noteCount % callEvery() === 0;
  const lit = atCall ? chimesPerCall : chimesDone;
  [...cycleEl.children].forEach((d, i) => d.classList.toggle('on', i < lit));
}

function setControlsDisabled(d) {
  ['target-select','chime-every','chimes-per-call','voice-select','tap-select']
    .forEach(id => { document.getElementById(id).disabled = d; });
}

function beginSession() {
  // Unlock audio first and synchronously: this runs inside the tap that
  // started the session, and there is no other gesture to lean on until the
  // user taps again.
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  startKeepAlive();
  readSettings();
  checkSpeechAvailability();

  running = true;
  noteCount = 0;
  stamps.length = 0;
  sessionStart = performance.now();

  buildCycleDots();
  paintCycleDots();
  countEl.textContent = '0';
  padEl.classList.add('running', 'active');
  textEl.textContent = 'Tap once for every note.';
  summaryEl.style.display = 'none';
  fillEl.style.width = '0%';
  startBtn.disabled = true;
  stopBtn.disabled = false;
  undoBtn.disabled = false;
  setControlsDisabled(true);
  startWakeLock();

  clearInterval(tickTimer);
  tickTimer = setInterval(onTick, 500);
}

function onTick() {
  if (!running) return;
  if (target.kind === 'time') {
    const elapsed = (performance.now() - sessionStart) / 1000;
    fillEl.style.width = Math.min(100, (elapsed / target.value) * 100) + '%';
    if (elapsed >= target.value) endSession(true);
  }
}

function note() {
  if (!running) return;
  noteCount++;
  stamps.push(performance.now());
  countEl.textContent = String(noteCount);
  paintCycleDots();

  if (navigator.vibrate) { try { navigator.vibrate(8); } catch(e) {} }
  flashPad();
  ensureAudioAwake();

  const atCall  = noteCount % callEvery() === 0;
  const atChime = noteCount % chimeEvery === 0;

  // Three layers, quietest first. The tap answers every note; the chime marks
  // the group; the chord marks the count. On a call the chord is the answer to
  // the tap, so the tap sound would only muddy its attack.
  if (!atCall) playTap(tapMode, (noteCount - 1) % callEvery(), callEvery());

  if (atCall) {
    if (!speechWantsSilence()) playMilestone();
    if (countMode === 'spoken')     speakCount(noteCount);
    else if (countMode === 'tones') playCountTones(noteCount);
  } else if (atChime) {
    const step = (Math.floor(noteCount / chimeEvery) % chimesPerCall) - 1;
    playChime(Math.max(0, step), chimesPerCall);
  }

  if (target.kind === 'notes') {
    fillEl.style.width = Math.min(100, (noteCount / target.value) * 100) + '%';
    if (noteCount >= target.value) {
      // Let the chord and the struck count finish before the closing bell —
      // arriving is the point of the session. The count itself takes longer
      // for a big number, so wait for it rather than a fixed pause.
      const wait = countMode === 'spoken' ? 600 + spokenCountDuration(noteCount)
                 : countMode === 'tones'  ? 1600 + countToneDuration(noteCount)
                 : 2000;
      setTimeout(() => { if (running) endSession(true); }, wait);
    }
  }
}

function undo() {
  if (!running || noteCount === 0) return;
  noteCount--;
  stamps.pop();
  countEl.textContent = String(noteCount);
  paintCycleDots();
  if (target.kind === 'notes') {
    fillEl.style.width = Math.min(100, (noteCount / target.value) * 100) + '%';
  }
}

function flashPad() {
  padEl.classList.remove('active');
  padEl.classList.add('flash');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      padEl.classList.remove('flash');
      padEl.classList.add('active');
    });
  });
}

function endSession(reached) {
  if (!running) return;
  running = false;
  clearInterval(tickTimer);
  stopWakeLock();
  // The closing chord still has to sound, so the hardware stays awake until
  // its tail is gone.
  setTimeout(stopKeepAlive, 6000);
  padEl.classList.remove('running', 'active');
  textEl.textContent = reached ? 'Complete.' : 'Ended.';
  startBtn.disabled = false;
  stopBtn.disabled = true;
  undoBtn.disabled = true;
  setControlsDisabled(false);
  fillEl.style.width = '0%';
  playEndChime();
  recordLifetime(noteCount);
  renderSummary();
}

// ─── Summary ──────────────────────────────────────────────────────────────────

function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function fmtDuration(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return s === 60 ? `${m + 1}:00` : `${m}:${String(s).padStart(2, '0')}`;
}

function renderSummary() {
  if (noteCount === 0) return;
  const totalSec = (performance.now() - sessionStart) / 1000;
  const gaps = [];
  for (let i = 1; i < stamps.length; i++) gaps.push((stamps[i] - stamps[i - 1]) / 1000);

  document.getElementById('s-notes').textContent = noteCount;
  document.getElementById('s-dur').textContent = fmtDuration(totalSec);

  const med = median(gaps);
  document.getElementById('s-pace').textContent = med ? (60 / med).toFixed(1) : '—';
  document.getElementById('s-gap').textContent = gaps.length ? Math.max(...gaps).toFixed(1) : '—';

  // Interval trace. A long bar is a long silence between notes — usually
  // either settling or drifting, and worth knowing which.
  const trace = document.getElementById('trace');
  trace.innerHTML = '';
  if (gaps.length) {
    // Clip the scale at the 95th percentile so one very long pause doesn't
    // flatten the rest of the session into nothing.
    const sorted = [...gaps].sort((a, b) => a - b);
    const p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))] || 1;
    const medGap = med || 1;
    // Downsample so the bars stay readable on a phone.
    const maxBars = 60;
    const stride = Math.ceil(gaps.length / maxBars);
    for (let i = 0; i < gaps.length; i += stride) {
      const slice = gaps.slice(i, i + stride);
      const v = slice.reduce((a, b) => a + b, 0) / slice.length;
      const bar = document.createElement('div');
      bar.className = 'bar' + (v > medGap * 2.5 ? ' gap' : '');
      bar.style.height = Math.max(2, Math.min(100, (v / p95) * 100)) + '%';
      trace.appendChild(bar);
    }
    document.getElementById('trace-caption').textContent =
      `${gaps.length + 1} notes · median ${medGap.toFixed(1)}s apart`;
  }
  summaryEl.style.display = 'block';
}

// ─── Lifetime tally ───────────────────────────────────────────────────────────
// The only persistence in the app. It exists because a number that keeps
// growing across sessions is the cheapest reason to sit down again.

const LS_KEY = 'noting-lifetime-v1';

function readLifetime() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return { notes: 0, sessions: 0 };
    const o = JSON.parse(raw);
    return { notes: o.notes || 0, sessions: o.sessions || 0 };
  } catch(e) { return { notes: 0, sessions: 0 }; }
}

function recordLifetime(n) {
  if (n <= 0) return;
  const lt = readLifetime();
  lt.notes += n;
  lt.sessions += 1;
  try { localStorage.setItem(LS_KEY, JSON.stringify(lt)); } catch(e) {}
  paintLifetime();
}

function paintLifetime() {
  const lt = readLifetime();
  document.getElementById('lt-notes').textContent =
    lt.notes ? `${lt.notes.toLocaleString()} notes` : '';
  document.getElementById('lt-sessions').textContent =
    lt.sessions ? `${lt.sessions} session${lt.sessions === 1 ? '' : 's'}` : '';
}

// ─── Input ────────────────────────────────────────────────────────────────────
// pointerdown only: the note lands the instant the finger touches, and there
// is no second event to double-count.

padEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (running) note();
  else beginSession();
});
padEl.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (running) note(); else beginSession();
  } else if (e.code === 'Backspace') {
    e.preventDefault();
    undo();
  } else if (e.code === 'Escape') {
    if (running) endSession(false);
  }
});

document.getElementById('speech-test').addEventListener('click', runSpeechTrial);
document.getElementById('heard-yes').addEventListener('click', () => speechHeard(true));
document.getElementById('heard-no').addEventListener('click', () => speechHeard(false));

startBtn.addEventListener('click', beginSession);
stopBtn.addEventListener('click', () => endSession(false));
undoBtn.addEventListener('click', undo);

['chime-every','chimes-per-call','target-select','voice-select','tap-select'].forEach(id => {
  document.getElementById(id).addEventListener('change', syncCaption);
  document.getElementById(id).addEventListener('input', syncCaption);
});

syncCaption();
paintLifetime();
</script>
</body>
</html>
