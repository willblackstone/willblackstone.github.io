<script>
// ─── Ladder logic ─────────────────────────────────────────────────────────────
//
// The rules of a session and nothing else: no DOM, no clock, no storage.
// reduce(state, action) takes a session state and one action and returns the
// next state, never modifying the one it was given. Undo falls out of that for
// free — each state an action replaces is kept on a stack — and the rules can
// be checked on their own: run runLadderTests() in the browser console.
//
// Rungs are numbered from 0 in here (0 is rung 1, the bottom). Only what the
// player sees adds 1.
//
// Actions:  { type: 'YES' }        a clean rep
//           { type: 'NO' }         a miss
//           { type: 'STEP_DOWN' }  choosing to go down a rung
//           { type: 'STEP_UP' }    going back up to a rung already earned this
//                                  session, when the ladder allows it
//           { type: 'UNDO' }       take back the last action
// There is deliberately no way up to a rung that hasn't been earned: only a
// full streak does that. Anything unrecognised returns the state unchanged.
//
// A ladder's rules, all adjustable:
//   target      clean reps in a row to climb
//   climbBack   clean reps to climb back onto a rung already earned this session
//   missDrop    rungs a miss costs (0 or 1)
//   freeReturn  STEP_UP may go back up to earned rungs

const LadderLogic = (() => {
  'use strict';

  // Without rules, a ladder plays by the strictest: the full target every
  // time, a miss drops a rung, no way back up but earning it.
  function createSession(rungCount, target, rules = {}) {
    return {
      rungCount,
      target,
      climbBack: Math.min(target, rules.climbBack || target),
      missDrop: rules.missDrop === 0 ? 0 : 1,
      freeReturn: rules.freeReturn === true,
      rung: 0,              // where the player stands now
      streak: 0,            // clean reps in a row on this rung
      furthest: 0,          // highest rung stood on this session: everything up to it is earned
      topCleared: false,    // the top rung's streak has been completed at least once
      consolidation: 0,     // clean reps on the top rung beyond its target
      reps: 0,
      yes: 0,
      attempts: new Array(rungCount).fill(0),   // per rung: every answered rep
      misses: new Array(rungCount).fill(0),     // per rung: the No answers
      past: [],             // the states earlier actions replaced, newest last
    };
  }

  function reduce(state, action) {
    const type = action && action.type;
    if (type === 'UNDO') {
      if (!state.past.length) return state;
      const previous = state.past[state.past.length - 1];
      return { ...previous, past: state.past.slice(0, -1) };
    }
    const next = apply(state, type);
    if (next === state) return state;
    // Keep what this action replaced, minus its own history, so UNDO can put
    // it back exactly: rung, streak, counts and all.
    const { past, ...replaced } = state;
    return { ...next, past: past.concat([replaced]) };
  }

  // The rules for one action. Returns the same object when nothing changes.
  function apply(s, type) {
    switch (type) {
      case 'YES': {
        const next = {
          ...s,
          reps: s.reps + 1,
          yes: s.yes + 1,
          attempts: bump(s.attempts, s.rung),
          streak: s.streak + 1,
        };
        if (next.streak < repsToClimb(s)) return next;
        if (s.rung < s.rungCount - 1) {
          // Earned: up one rung, where the streak starts again from nothing.
          next.rung = s.rung + 1;
          next.streak = 0;
          next.furthest = Math.max(s.furthest, next.rung);
        } else {
          // The top rung has nowhere further to go: stay, and keep counting.
          // Every clean rep past the target is consolidation.
          if (next.streak > s.target) next.consolidation = s.consolidation + 1;
          next.topCleared = true;
        }
        return next;
      }
      case 'NO':
        // A miss costs the streak, and a rung if there is one to lose.
        return {
          ...s,
          reps: s.reps + 1,
          attempts: bump(s.attempts, s.rung),
          misses: bump(s.misses, s.rung),
          rung: Math.max(0, s.rung - missDropOf(s)),
          streak: 0,
        };
      case 'STEP_DOWN':
        if (s.rung === 0) return s;
        return { ...s, rung: s.rung - 1, streak: 0 };
      case 'STEP_UP':
        if (!canStepUp(s)) return s;
        return { ...s, rung: s.rung + 1, streak: 0 };
      default:
        return s;
    }
  }

  function bump(counts, i) {
    const copy = counts.slice();
    copy[i] += 1;
    return copy;
  }

  // Below the furthest rung, this one has been cleared already this session.
  // States saved before these rules existed lack the fields, hence the fallbacks.
  function repsToClimb(s) {
    return s.rung < s.furthest ? (s.climbBack || s.target) : s.target;
  }
  function missDropOf(s) { return s.missDrop === 0 ? 0 : 1; }
  function canStepUp(s) { return s.freeReturn === true && s.rung < s.furthest; }

  // On the top rung with its target met: the streak shown is consolidation
  // now, not progress towards a climb.
  function isConsolidating(s) {
    return s.rung === s.rungCount - 1 && s.streak >= s.target;
  }

  return { createSession, reduce, isConsolidating, repsToClimb, canStepUp };
})();

// ─── Ladder logic tests ───────────────────────────────────────────────────────
//
// The core rules, checked against LadderLogic alone. In the browser console:
//   runLadderTests()
// prints one line per rule and returns true if every check passed.

function runLadderTests() {
  const { createSession, reduce, isConsolidating } = LadderLogic;
  const play = (s, ...types) => types.reduce((state, type) => reduce(state, { type }), s);
  const results = [];

  function check(rule, fn) {
    try { fn(); results.push({ rule, ok: true }); }
    catch (e) { results.push({ rule, ok: false, why: e.message }); }
  }
  function expect(actual, expected, what) {
    const a = JSON.stringify(actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`${what}: expected ${b}, got ${a}`);
  }
  function same(actual, expected, what) {
    if (actual !== expected) throw new Error(`${what}: the state changed`);
  }
  // A state without its undo history, keys in a fixed order, for comparing.
  function bare(state) {
    const { past, ...rest } = state;
    return Object.keys(rest).sort().reduce((o, k) => { o[k] = rest[k]; return o; }, {});
  }

  // Rung numbers here are 0-based, as inside LadderLogic: rung 0 is rung 1.

  check('climbing: a full streak moves up one rung and the streak restarts', () => {
    let s = play(createSession(3, 3), 'YES', 'YES');
    expect([s.rung, s.streak], [0, 2], 'after 2 of 3');
    s = play(s, 'YES');
    expect([s.rung, s.streak, s.furthest], [1, 0, 1], 'after 3 of 3');
  });

  check('dropping: a miss goes down one rung and the streak restarts', () => {
    let s = play(createSession(3, 2), 'YES', 'YES', 'YES');    // rung 1, streak 1
    s = play(s, 'NO');
    expect([s.rung, s.streak], [0, 0], 'after the miss');
    expect([s.attempts[1], s.misses[1]], [2, 1], 'counted on the rung it happened on');
  });

  check('rung-1 miss: stays on rung 1 and the streak restarts', () => {
    const s = play(createSession(3, 5), 'YES', 'YES', 'NO');
    expect([s.rung, s.streak, s.misses[0]], [0, 0, 1], 'after the miss');
  });

  check('climb back: a rung already earned takes climbBack reps, a new one the full target', () => {
    let s = play(createSession(3, 3, { climbBack: 2 }), 'YES', 'YES', 'YES', 'NO');   // earned rung 1, dropped
    expect([s.rung, s.furthest], [0, 1], 'after the drop');
    s = play(s, 'YES', 'YES');
    expect([s.rung, s.streak], [1, 0], 'back up after 2');
    s = play(s, 'YES', 'YES');
    expect([s.rung, s.streak], [1, 2], 'rung 2 is new, so 2 is not enough');
    s = play(s, 'YES');
    expect(s.rung, 2, 'up after the full 3');
  });

  check('a miss can be set to keep the rung', () => {
    const s = play(createSession(3, 2, { missDrop: 0 }), 'YES', 'YES', 'YES', 'NO');
    expect([s.rung, s.streak], [1, 0], 'after the miss');
  });

  check('stepping back up: only to earned rungs, and only when allowed', () => {
    const rules = { freeReturn: true };
    let s = play(createSession(3, 2, rules), 'YES', 'YES', 'STEP_DOWN');      // earned rung 1, stepped off it
    s = play(s, 'STEP_UP');
    expect([s.rung, s.streak], [1, 0], 'back on the earned rung');
    same(reduce(s, { type: 'STEP_UP' }), s, 'rung 2 not earned yet');
    const strict = play(createSession(3, 2), 'YES', 'YES', 'STEP_DOWN');
    same(reduce(strict, { type: 'STEP_UP' }), strict, 'not allowed on a strict ladder');
  });

  check('no manual up: only a full streak climbs; stepping down works', () => {
    const s = play(createSession(3, 2), 'YES');
    ['UP', 'STEP_UP', 'CLIMB', 'NEXT', undefined].forEach(type => same(reduce(s, { type }), s, String(type)));
    const down = play(createSession(3, 2), 'YES', 'YES', 'YES', 'STEP_DOWN');   // from rung 1, streak 1
    expect([down.rung, down.streak], [0, 0], 'after stepping down');
    same(reduce(down, { type: 'STEP_DOWN' }), down, 'stepping down from rung 1');
  });

  check('undo across a rung change puts rung, streak and counts back', () => {
    const before = play(createSession(3, 2), 'YES');      // rung 0, streak 1
    const climbed = play(before, 'YES');                  // rung 1, streak 0
    expect(bare(reduce(climbed, { type: 'UNDO' })), bare(before), 'undoing the climb');
    const dropped = play(climbed, 'YES', 'NO');           // rung 1 streak 1, then down to rung 0
    const undone = reduce(dropped, { type: 'UNDO' });
    expect([undone.rung, undone.streak, undone.reps, undone.misses[1]], [1, 1, 3, 0], 'undoing the drop');
    let s = dropped;
    while (s.past.length) s = reduce(s, { type: 'UNDO' });
    expect(bare(s), bare(createSession(3, 2)), 'undone all the way back to the start');
    same(reduce(s, { type: 'UNDO' }), s, 'undo with nothing left to undo');
  });

  check('top rung: clearing it stays put and keeps counting as consolidation', () => {
    let s = play(createSession(2, 2), 'YES', 'YES', 'YES', 'YES');   // climb, then clear the top
    expect([s.rung, s.streak, s.topCleared, s.consolidation], [1, 2, true, 0], 'on clearing');
    s = play(s, 'YES', 'YES');
    expect([s.rung, s.streak, s.consolidation, isConsolidating(s)], [1, 4, 2, true], 'two reps later');
    s = play(s, 'NO');
    expect([s.rung, s.streak, s.topCleared], [0, 0, true], 'a miss still drops a rung');
  });

  check('reduce never modifies the state it is given', () => {
    const s = play(createSession(3, 2), 'YES', 'YES', 'NO');
    const before = JSON.stringify(s);
    ['YES', 'NO', 'STEP_DOWN', 'UNDO'].forEach(type => reduce(s, { type }));
    expect(JSON.stringify(s), before, 'state after four actions');
  });

  results.forEach(r => console.log(`${r.ok ? '✓' : '✗'} ${r.rule}${r.ok ? '' : ` — ${r.why}`}`));
  const failed = results.filter(r => !r.ok).length;
  console.log(failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`);
  return failed === 0;
}

// ─── Storage ──────────────────────────────────────────────────────────────────
//
// Everything lives under one localStorage key as a single versioned object:
//
//   { version, ladders, sessions, settings }
//
//   ladder   { id, name, focus, target, climbBack, missDrop (0 | 1), freeReturn,
//            rungs: [{ id, name, intention, placeholder }] }
//            rungs[0] is the bottom rung. `placeholder` marks an intention the
//            app wrote rather than the player; editing it clears the flag.
//   session { id, ladderId, ladderName, startedAt, endedAt (ISO strings),
//            plannedSec, actualSec (time not paused), endedEarly, target,
//            reps, yes, yesRate (0–1), furthestRung (1-based), rungCount,
//            topCleared, consolidation, notes,
//            rungs: [{ id, name, attempts, misses }] }   bottom rung first
//   settings { timer: '5' | '10' | 'custom', customMinutes }
//
// The session in progress is kept separately (LIVE_KEY) so a reload — iOS
// throwing the page away in the background, say — can pick it up again. Every
// read and write is guarded: Private Browsing or a full store should cost the
// saving, never the session.

const DATA_KEY = 'learningLadder:data';
const LIVE_KEY = 'learningLadder:live';
const THEME_KEY = 'learningLadder:theme';
const SCHEMA_VERSION = 1;

let data = null;
let storageOk = true;
let saveTimer = null;

function uid(prefix) {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// What a new ladder starts with. The editor changes any of it per ladder.
const DEFAULT_RULES = { target: 10, climbBack: 5, missDrop: 1, freeReturn: true };

// The first-launch ladder. Its intentions are stand-ins, flagged so the editor
// says so until they're rewritten.
function seedData() {
  const rung = (name, intention) => ({ id: uid('r'), name, intention, placeholder: true });
  return {
    version: SCHEMA_VERSION,
    ladders: [{
      id: uid('l'),
      name: 'The Drop',
      focus: '',
      ...DEFAULT_RULES,
      rungs: [
        rung('BCH breath', 'Notice the whole breath, start to finish.'),
        rung('Elbows and rotator cuff', 'Elbows and cuff in awareness through the whole move.'),
        rung('Elbows + rotator cuff + leadpipe hover', 'Elbows and cuff still in awareness as the leadpipe hovers.'),
        rung('Elbows + rotator cuff + leadpipe no note', 'Elbows and cuff still in awareness, leadpipe in place, no note.'),
        rung('Elbows + rotator cuff + leadpipe note', 'Elbows and cuff still in awareness as the note begins.'),
      ],
    }],
    sessions: [],
    settings: { timer: '10', customMinutes: 15 },
  };
}

function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(DATA_KEY); }
  catch (e) { storageOk = false; }
  if (raw === null) {
    const fresh = seedData();
    writeData(fresh);
    return fresh;
  }
  try {
    return normalise(migrate(JSON.parse(raw)));
  } catch (e) {
    // Unreadable. Set the original aside rather than overwrite it, then start
    // from the seed so the app still works.
    try { localStorage.setItem(`${DATA_KEY}:unreadable:${Date.now()}`, raw); } catch (e2) {}
    notice('Saved data could not be read, so the app started fresh. The old data was set aside in storage, not deleted.');
    const fresh = seedData();
    writeData(fresh);
    return fresh;
  }
}

function writeData(d) {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(d));
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
  return storageOk;
}

function saveData() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!writeData(data)) renderNotice();
}

// For typing: one write when the typing stops, not one per keystroke.
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 400);
}

function flushSave() {
  if (saveTimer) saveData();
}

// Brings older saved shapes up to SCHEMA_VERSION one step at a time. Version 1
// is the first. When the shape changes: bump SCHEMA_VERSION and add a step,
//   if (d.version === 1) { ...reshape d...; d.version = 2; }
function migrate(d) {
  if (!isObject(d)) throw new Error("it isn't Learning Ladder data");
  d = { ...d, version: Number.isInteger(d.version) ? d.version : 1 };
  if (d.version > SCHEMA_VERSION) throw new Error('it was saved by a newer version of Learning Ladder');
  return d;
}

// Checks and repairs data from storage or an imported file, so the rest of
// the app can trust its shape. Throws if there's nothing ladder-like in it.
function normalise(d) {
  if (!Array.isArray(d.ladders)) throw new Error('there are no ladders in it');
  const seen = new Set();
  const idFor = (id, prefix) => {
    let v = typeof id === 'string' && id ? id : uid(prefix);
    if (seen.has(v)) v = uid(prefix);
    seen.add(v);
    return v;
  };

  const ladders = d.ladders.filter(isObject).map(l => {
    const rungs = (Array.isArray(l.rungs) ? l.rungs : []).filter(isObject).map(r => ({
      id: idFor(r.id, 'r'),
      name: text(r.name),
      intention: text(r.intention),
      placeholder: r.placeholder === true,
    }));
    if (!rungs.length) rungs.push(blankRung());
    return {
      id: idFor(l.id, 'l'),
      name: text(l.name).trim() || 'Untitled ladder',
      focus: text(l.focus),
      target: clampInt(l.target, 1, 100, DEFAULT_RULES.target),
      climbBack: clampInt(l.climbBack, 1, 100, DEFAULT_RULES.climbBack),
      missDrop: l.missDrop === 0 ? 0 : 1,
      freeReturn: typeof l.freeReturn === 'boolean' ? l.freeReturn : DEFAULT_RULES.freeReturn,
      rungs,
    };
  });

  const sessions = (Array.isArray(d.sessions) ? d.sessions : [])
    .filter(s => isObject(s) && Array.isArray(s.rungs) && s.rungs.length && !isNaN(Date.parse(s.startedAt)))
    .map(s => {
      const rungs = s.rungs.map(r => isObject(r) ? r : {}).map(r => ({
        id: text(r.id),
        name: text(r.name),
        attempts: clampInt(r.attempts, 0, 1e6, 0),
        misses: clampInt(r.misses, 0, 1e6, 0),
      }));
      const reps = clampInt(s.reps, 0, 1e6, 0);
      const yes = clampInt(s.yes, 0, reps, 0);
      const started = new Date(s.startedAt).toISOString();
      return {
        id: idFor(s.id, 's'),
        ladderId: text(s.ladderId),
        ladderName: text(s.ladderName) || 'Untitled ladder',
        startedAt: started,
        endedAt: isNaN(Date.parse(s.endedAt)) ? started : new Date(s.endedAt).toISOString(),
        plannedSec: clampInt(s.plannedSec, 0, 1e6, 0),
        actualSec: clampInt(s.actualSec, 0, 1e7, 0),
        endedEarly: s.endedEarly === true,
        target: clampInt(s.target, 1, 100, 10),
        reps,
        yes,
        yesRate: reps ? Math.round(yes / reps * 1000) / 1000 : 0,
        furthestRung: clampInt(s.furthestRung, 1, rungs.length, 1),
        rungCount: rungs.length,
        topCleared: s.topCleared === true,
        consolidation: clampInt(s.consolidation, 0, 1e6, 0),
        notes: text(s.notes),
        rungs,
      };
    })
    .sort((a, b) => (a.startedAt < b.startedAt ? -1 : a.startedAt > b.startedAt ? 1 : 0));

  const st = isObject(d.settings) ? d.settings : {};
  return {
    version: SCHEMA_VERSION,
    ladders,
    sessions,
    settings: {
      timer: ['5', '10', 'custom'].includes(st.timer) ? st.timer : '10',
      customMinutes: clampInt(st.customMinutes, 1, 180, 15),
    },
  };
}

function saveLive() {
  if (!live) return;
  sessionUi.lastLiveSave = Date.now();
  try { localStorage.setItem(LIVE_KEY, JSON.stringify({ ...live, savedAt: Date.now() })); } catch (e) {}
}

function clearLive() {
  try { localStorage.removeItem(LIVE_KEY); } catch (e) {}
}

function loadLive() {
  try {
    const raw = localStorage.getItem(LIVE_KEY);
    if (!raw) return null;
    const l = JSON.parse(raw);
    const s = l && l.state;
    const ok = s && Array.isArray(l.rungs) && l.rungs.length === s.rungCount &&
      Array.isArray(s.past) && Number.isInteger(s.rung) && s.rung >= 0 && s.rung < s.rungCount &&
      Number.isFinite(l.plannedMs) && Number.isFinite(l.activeMs);
    if (ok) return l;
  } catch (e) {}
  clearLive();
  return null;
}

// Asks the browser not to evict this site's storage under pressure. Safari may
// or may not grant it; either way nothing else depends on the answer.
function requestPersistence() {
  try {
    const sm = navigator.storage;
    if (!sm || !sm.persist) return;
    (sm.persisted ? sm.persisted() : Promise.resolve(false))
      .then(already => already || sm.persist())
      .catch(() => {});
  } catch (e) {}
}

// ─── Helpers ──────────────────────────────────────────────────────────────────

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function isObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
function text(v) { return typeof v === 'string' ? v : typeof v === 'number' ? String(v) : ''; }

function clampInt(v, lo, hi, fallback) {
  const n = typeof v === 'number' ? v : typeof v === 'string' && v.trim() !== '' ? Number(v) : NaN;
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, Math.round(n))) : fallback;
}

function plural(n, one, many) { return `${n} ${n === 1 ? one : many || one + 's'}`; }
function pct(rate) { return Math.round(rate * 100) + '%'; }
function pad2(n) { return String(n).padStart(2, '0'); }

function fmtClock(totalSec) {
  const sec = Math.max(0, Math.round(totalSec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}
function fmtMinutes(sec) { return `${Math.round(sec / 6) / 10} min`; }
function fmtDay(iso) {
  return new Date(iso).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtTimeOfDay(iso) {
  return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function rungLabel(name, i) { return (name || '').trim() || `Rung ${i + 1}`; }
function blankRung() { return { id: uid('r'), name: '', intention: '', placeholder: false }; }

// The rung(s) with the most misses, top rung first; null if there were none.
function mostMissed(rungs) {
  const count = Math.max(0, ...rungs.map(r => r.misses));
  if (!count) return null;
  const list = rungs.map((r, i) => ({ n: i + 1, name: r.name, misses: r.misses }))
    .filter(r => r.misses === count).reverse();
  return { count, list };
}

// ─── Navigation ───────────────────────────────────────────────────────────────
//
// Five screens in one page, one showing at a time. Nothing goes into browser
// history: a back-swipe in the middle of a session should leave the page (the
// session is saved and comes back paused), not switch screens underneath it.

const view = {
  screen: 'home',
  ladderId: null,          // the ladder open on the ladder screen
  editing: false,
  historyLadderId: null,
  historyBack: 'home',     // where History's back button goes
  summary: null,           // { record, saved, minutes } for the summary screen
};

function show(screen) {
  view.screen = screen;
  document.querySelectorAll('[data-screen]').forEach(el => { el.hidden = el.dataset.screen !== screen; });
  document.documentElement.classList.toggle('in-session', screen === 'session');
  window.scrollTo(0, 0);
}

function goHome() {
  view.editing = false;
  renderHome();
  show('home');
}

// ─── Ladders screen ───────────────────────────────────────────────────────────

let noticeText = '';
let noticeTimer = null;

function renderHome() {
  $('ladder-list').innerHTML = data.ladders.length
    ? data.ladders.map(ladderCardHtml).join('')
    : '<li class="empty">No ladders yet.</li>';
  renderThemeChoice();
  renderNotice();
}

function ladderCardHtml(l) {
  const last = latestSession(l.id);
  return `
    <li><button class="card" data-action="open-ladder" data-id="${esc(l.id)}">
      <span class="card-title">${esc(l.name)}</span>
      ${l.focus ? `<span class="card-focus">${esc(l.focus)}</span>` : ''}
      <span class="card-meta">${plural(l.rungs.length, 'rung')} · ${l.target} clean in a row to climb</span>
      ${last ? `<span class="card-meta">Last: ${esc(fmtDay(last.startedAt))} · reached ${last.furthestRung} of ${last.rungCount}${last.topCleared ? ', top cleared' : ''}</span>` : ''}
    </button></li>`;
}

function latestSession(ladderId) {
  for (let i = data.sessions.length - 1; i >= 0; i--) {
    if (data.sessions[i].ladderId === ladderId) return data.sessions[i];
  }
  return null;
}

function newLadder() {
  const l = { id: uid('l'), name: 'New ladder', focus: '', ...DEFAULT_RULES, rungs: [blankRung()] };
  data.ladders.push(l);
  saveData();
  openLadder(l.id, true);
  // Still inside the tap, so iOS will bring the keyboard up.
  const name = document.querySelector('#ladder-body [data-field="name"]');
  name.focus();
  name.setSelectionRange(0, name.value.length);
}

function notice(msg, ms) {
  noticeText = msg;
  clearTimeout(noticeTimer);
  if (ms) noticeTimer = setTimeout(() => { noticeText = ''; renderNotice(); }, ms);
  renderNotice();
}

function renderNotice() {
  const msg = storageOk ? noticeText
    : "This browser isn't letting the app save (Private Browsing?). Ladders and history will be lost when the page closes.";
  $('home-notice').textContent = msg;
  $('home-notice').hidden = !msg;
}

// ─── Ladder screen: view, editor, start ───────────────────────────────────────
//
// Rungs are drawn as a ladder: top rung at the top, rung 1 at the bottom where
// every session starts. So ↑ and ↓ in the editor mean up and down the ladder.
// Edits save as they're typed.

function currentLadder() { return data.ladders.find(l => l.id === view.ladderId) || null; }

function openLadder(id, editing) {
  view.ladderId = id;
  view.editing = !!editing;
  show('ladder');
  renderLadder();
}

function renderLadder() {
  const l = currentLadder();
  if (!l) { goHome(); return; }
  $('screen-ladder').classList.toggle('editing', view.editing);
  $('edit-toggle').textContent = view.editing ? 'Done' : 'Edit';
  $('start-dock').hidden = view.editing;
  $('ladder-body').innerHTML = view.editing ? editorHtml(l) : ladderViewHtml(l);
  if (view.editing) $('ladder-body').querySelectorAll('textarea').forEach(autosize);
  else renderTimerChoice();
}

function ladderViewHtml(l) {
  const rows = l.rungs.map((r, i) => `
    <li class="rung-row${i === 0 ? ' base' : ''}">
      <span class="rung-num">${i + 1}</span>
      <div>
        <div class="rung-name">${esc(rungLabel(r.name, i))}</div>
        ${r.intention ? `<div class="rung-intent${r.placeholder ? ' is-placeholder' : ''}">${esc(r.intention)}${r.placeholder ? ' <span class="tag">placeholder</span>' : ''}</div>` : ''}
      </div>
    </li>`).reverse().join('');
  return `
    <div class="ladder-head">
      <h1 class="ladder-title">${esc(l.name)}</h1>
      ${l.focus ? `<p class="ladder-focus">${esc(l.focus)}</p>` : ''}
      <p class="ladder-rule">${esc(rulesText(l))}</p>
    </div>
    ${l.rungs.some(r => r.placeholder) ? '<p class="hint">Intentions marked <span class="tag">placeholder</span> are stand-ins. Tap Edit to put them in your own words.</p>' : ''}
    <ul class="rung-list" aria-label="Rungs, top first">${rows}</ul>
    <button class="quiet back" data-action="ladder-history">History for this ladder</button>`;
}

function rulesText(l) {
  return [
    `${l.target} clean in a row to climb`,
    l.climbBack < l.target ? `${l.climbBack} to climb back to a rung already earned` : '',
    l.missDrop ? 'a miss drops one rung' : 'a miss restarts the streak',
    l.freeReturn ? 'swipe up and down between earned rungs' : 'swipe down to step down',
    'always starts at rung 1',
  ].filter(Boolean).join(' · ');
}

function editorHtml(l) {
  const top = l.rungs.length - 1;
  const cards = l.rungs.map((r, i) => `
    <li class="rung-card" data-rung-id="${esc(r.id)}">
      <div class="rung-card-head">
        <span class="label">Rung ${i + 1}${i === 0 ? ' · start' : ''}${i === top && top > 0 ? ' · top' : ''}</span>
        <div class="rung-tools">
          <button class="icon-btn" data-action="rung-up" aria-label="Move up the ladder"${i === top ? ' disabled' : ''}>↑</button>
          <button class="icon-btn" data-action="rung-down" aria-label="Move down the ladder"${i === 0 ? ' disabled' : ''}>↓</button>
          <button class="icon-btn danger" data-action="rung-delete" aria-label="Delete rung"${top === 0 ? ' disabled' : ''}>✕</button>
        </div>
      </div>
      <input type="text" data-rung-field="name" value="${esc(r.name)}" placeholder="Rung name" aria-label="Rung ${i + 1} name" autocomplete="off" enterkeyhint="done">
      <div class="intent-label">Intention${r.placeholder ? ' <span class="tag">placeholder</span>' : ''}</div>
      <textarea rows="1" data-rung-field="intention" class="${r.placeholder ? 'is-placeholder' : ''}" placeholder="One line: what makes this rep a Yes" aria-label="Rung ${i + 1} intention" enterkeyhint="done">${esc(r.intention)}</textarea>
    </li>`).reverse().join('');
  return `
    <label class="field"><span class="label">Ladder name</span>
      <input type="text" data-field="name" value="${esc(l.name)}" autocomplete="off" enterkeyhint="done"></label>
    <label class="field"><span class="label">Focus <span class="opt">(optional)</span></span>
      <input type="text" data-field="focus" value="${esc(l.focus)}" placeholder="What this ladder is for" autocomplete="off" enterkeyhint="done"></label>
    <label class="field inline"><span>Clean reps in a row to climb</span>
      <input type="number" data-field="target" value="${l.target}" min="1" max="100" inputmode="numeric"></label>
    <label class="field inline"><span>Clean reps to climb back to a rung already earned this session</span>
      <input type="number" data-field="climbBack" value="${l.climbBack}" min="1" max="100" inputmode="numeric"></label>
    <label class="field inline wide-ctl"><span>A miss</span>
      <select data-field="missDrop">
        <option value="1"${l.missDrop ? ' selected' : ''}>Drops one rung</option>
        <option value="0"${l.missDrop ? '' : ' selected'}>Keeps the rung</option>
      </select></label>
    <label class="field inline wide-ctl"><span>Swipe back up to rungs earned this session</span>
      <input type="checkbox" data-field="freeReturn"${l.freeReturn ? ' checked' : ''}></label>
    <div class="rungs-head">
      <span class="label">Rungs · top first</span>
      <button class="btn small" data-action="add-rung">+ Add rung on top</button>
    </div>
    <ul class="rung-edit-list">${cards}</ul>
    <div class="editor-foot">
      <button class="btn wide" data-action="duplicate-ladder">Duplicate ladder</button>
      <button class="btn wide danger" data-action="delete-ladder">Delete ladder</button>
    </div>`;
}

function autosize(t) {
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 2 + 'px';
}

function toggleEdit() {
  if (view.editing) finishEditing();
  else view.editing = true;
  renderLadder();
}

function finishEditing() {
  const l = currentLadder();
  view.editing = false;
  if (!l) return;
  l.name = l.name.trim() || 'Untitled ladder';
  l.focus = l.focus.trim();
  l.rungs.forEach(r => { r.name = r.name.trim(); r.intention = r.intention.trim(); });
  saveData();
}

function onEditorInput(e) {
  const l = currentLadder();
  const t = e.target;
  if (!l || !view.editing) return;
  if (t.dataset.field === 'name') l.name = t.value;
  else if (t.dataset.field === 'focus') l.focus = t.value;
  else if (t.dataset.field === 'target') {
    const n = parseInt(t.value, 10);
    if (n >= 1 && n <= 100) l.target = n;
  } else if (t.dataset.field === 'climbBack') {
    const n = parseInt(t.value, 10);
    if (n >= 1 && n <= 100) l.climbBack = n;
  } else if (t.dataset.field === 'missDrop') {
    l.missDrop = t.value === '0' ? 0 : 1;
  } else if (t.dataset.field === 'freeReturn') {
    l.freeReturn = t.checked;
  } else if (t.dataset.rungField) {
    const r = l.rungs[rungIndex(l, t)];
    if (!r) return;
    if (t.dataset.rungField === 'name') {
      r.name = t.value;
    } else {
      // One line only. An intention is read at a glance between reps.
      if (t.value.includes('\n')) t.value = t.value.replace(/\s*\n+\s*/g, ' ');
      r.intention = t.value;
      if (r.placeholder) {
        r.placeholder = false;
        t.classList.remove('is-placeholder');
        const tag = t.parentElement.querySelector('.intent-label .tag');
        if (tag) tag.remove();
      }
      autosize(t);
    }
  } else {
    return;
  }
  saveSoon();
}

function onEditorChange(e) {
  const l = currentLadder();
  const t = e.target;
  if (!l || !view.editing) return;
  if (t.dataset.field === 'target') {
    l.target = clampInt(t.value, 1, 100, l.target);
    t.value = l.target;
  } else if (t.dataset.field === 'climbBack') {
    l.climbBack = clampInt(t.value, 1, 100, l.climbBack);
    t.value = l.climbBack;
  } else if (t.dataset.field === 'missDrop') {
    l.missDrop = t.value === '0' ? 0 : 1;
  } else if (t.dataset.field === 'freeReturn') {
    l.freeReturn = t.checked;
  }
  saveData();
}

function onEditorKeydown(e) {
  // Return closes the keyboard rather than adding a line.
  if (e.key === 'Enter' && e.target.matches('input, textarea')) {
    e.preventDefault();
    e.target.blur();
  }
}

function rungIndex(l, el) {
  const card = el.closest('[data-rung-id]');
  return card ? l.rungs.findIndex(r => r.id === card.dataset.rungId) : -1;
}

function rungCard(id) {
  return [...document.querySelectorAll('[data-rung-id]')].find(el => el.dataset.rungId === id);
}

function moveRung(btn, by) {
  const l = currentLadder();
  const i = rungIndex(l, btn);
  const j = i + by;
  if (i < 0 || j < 0 || j >= l.rungs.length) return;
  [l.rungs[i], l.rungs[j]] = [l.rungs[j], l.rungs[i]];
  saveData();
  renderLadder();
  rungCard(l.rungs[j].id).scrollIntoView({ block: 'nearest' });
}

function deleteRung(btn) {
  const l = currentLadder();
  const i = rungIndex(l, btn);
  if (i < 0 || l.rungs.length === 1) return;
  const r = l.rungs[i];
  const name = r.name.trim();
  if ((name || r.intention.trim()) && !confirm(`Delete rung ${i + 1}${name ? `, “${name}”` : ''}?`)) return;
  l.rungs.splice(i, 1);
  saveData();
  renderLadder();
}

function addRung() {
  const l = currentLadder();
  const r = blankRung();
  l.rungs.push(r);
  saveData();
  renderLadder();
  const card = rungCard(r.id);
  card.scrollIntoView({ block: 'center' });
  card.querySelector('input').focus();
}

function duplicateLadder() {
  const l = currentLadder();
  const copy = JSON.parse(JSON.stringify(l));
  copy.id = uid('l');
  copy.name = `${l.name} (copy)`;
  copy.rungs.forEach(r => { r.id = uid('r'); });
  data.ladders.splice(data.ladders.indexOf(l) + 1, 0, copy);
  saveData();
  openLadder(copy.id, true);
}

function deleteLadder() {
  const l = currentLadder();
  const n = data.sessions.filter(s => s.ladderId === l.id).length;
  if (!confirm(`Delete “${l.name}”?${n ? `\n\nIts ${plural(n, 'session')} will stay in History.` : ''}`)) return;
  data.ladders = data.ladders.filter(x => x !== l);
  saveData();
  goHome();
}

function renderTimerChoice() {
  const st = data.settings;
  document.querySelectorAll('[data-action="timer"]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.value === st.timer));
  });
  $('custom-row').hidden = st.timer !== 'custom';
  $('custom-min').value = st.customMinutes;
}

function chooseTimer(value) {
  data.settings.timer = value;
  saveData();
  renderTimerChoice();
}

function chosenMinutes() {
  const st = data.settings;
  return st.timer === 'custom' ? st.customMinutes : Number(st.timer);
}

// ─── Session ──────────────────────────────────────────────────────────────────
//
// `live` is the session in progress. It's plain data so it can be written to
// storage after every answer and picked up again after a reload:
//   ladderId, ladderName, rungs   the ladder as it was when the session started
//   plannedMs                     the length chosen
//   startedAt                     epoch ms
//   activeMs, runningSince        the clock: time banked so far, plus the stretch
//                                 running since `runningSince` (epoch ms; null
//                                 while paused)
//   timeUp                        time has run out; the next answer ends it
//   notes                         what's been jotted in the note so far
//   state                         the LadderLogic state
// `sessionUi` holds what only matters while this page is open.

const ANSWER_LOCK_MS = 450;    // a second Yes/No inside this is the same tap twice
const CONTROL_LOCK_MS = 250;

let live = null;
let sessionUi = freshSessionUi();
let tickTimer = null;

function freshSessionUi() {
  return {
    confirmingEnd: false,
    noteOpen: false,
    swipedAt: -Infinity,
    hint: '',
    hintTimer: null,
    notePaused: false,       // opening the note paused the clock, so closing it resumes
    pauseNote: '',
    lastAnswerAt: -Infinity,
    lastControlAt: -Infinity,
    shownRung: null,
    lastWakeCheck: 0,
    lastLiveSave: 0,
  };
}

function startSession(ladderId, minutes) {
  const l = data.ladders.find(x => x.id === ladderId);
  if (!l) { goHome(); return; }
  // This runs inside the tap on Start or Run again: the moment iOS allows
  // audio to be unlocked for an end tone that plays, untouched, minutes later.
  unlockAudio();
  live = {
    ladderId: l.id,
    ladderName: l.name,
    rungs: l.rungs.map(r => ({ id: r.id, name: r.name.trim(), intention: r.intention.trim() })),
    plannedMs: Math.round(minutes * 60000),
    startedAt: Date.now(),
    activeMs: 0,
    runningSince: Date.now(),
    timeUp: false,
    notes: '',
    state: LadderLogic.createSession(l.rungs.length, l.target,
      { climbBack: l.climbBack, missDrop: l.missDrop, freeReturn: l.freeReturn }),
  };
  enterSession('');
}

function enterSession(pauseNote) {
  sessionUi = freshSessionUi();
  sessionUi.pauseNote = pauseNote;
  show('session');
  renderSession();
  saveLive();
  keepAwake(true);
  clearInterval(tickTimer);
  tickTimer = setInterval(tick, 250);
}

function isPaused() { return !!live && live.runningSince === null; }

function elapsedMs() {
  return live.activeMs + (live.runningSince === null ? 0 : Date.now() - live.runningSince);
}

function tick() {
  if (!live) return;
  if (!live.timeUp && !isPaused() && elapsedMs() >= live.plannedMs) {
    // Time's up, but the rep in hand gets finished: the next answer ends it.
    live.timeUp = true;
    playEndTone();
    saveLive();
    renderSession();
    return;
  }
  paintTime();
  const now = Date.now();
  if (now - sessionUi.lastWakeCheck > 30000) {
    sessionUi.lastWakeCheck = now;
    acquireWakeLock();
  }
  if (!isPaused() && now - sessionUi.lastLiveSave > 15000) saveLive();
}

function answer(type) {
  if (!live || isPaused() || sessionUi.confirmingEnd || sessionUi.noteOpen) return;
  const now = performance.now();
  if (now - sessionUi.lastAnswerAt < ANSWER_LOCK_MS) return;
  if (now - sessionUi.swipedAt < ANSWER_LOCK_MS) return;    // the tap that ended a swipe
  sessionUi.lastAnswerAt = now;
  unlockAudio();
  acquireWakeLock();
  flash(type === 'YES' ? 'btn-yes' : 'btn-no');
  const before = live.state.rung;
  live.state = LadderLogic.reduce(live.state, { type });
  // A Yes that earns the next rung gets the whistle instead of a silly sound.
  if (type === 'NO') playMissSound();
  else (live.state.rung > before ? playClimbSound : playYesSound)();
  if (live.timeUp) { finishSession(false); return; }
  saveLive();
  renderSession();
}

function control(fn) {
  const now = performance.now();
  if (now - sessionUi.lastControlAt < CONTROL_LOCK_MS) return;
  sessionUi.lastControlAt = now;
  fn();
}

function sessionAction(type) {
  if (!live) return;
  const next = LadderLogic.reduce(live.state, { type });
  if (next === live.state) return;
  live.state = next;
  saveLive();
  renderSession();
}

function pause(note) {
  if (!live || isPaused()) return;
  live.activeMs += Date.now() - live.runningSince;
  live.runningSince = null;
  sessionUi.pauseNote = note || '';
  saveLive();
  renderSession();
}

function resume() {
  if (!live || !isPaused()) return;
  unlockAudio();
  acquireWakeLock();
  live.runningSince = Date.now();
  sessionUi.pauseNote = '';
  saveLive();
  renderSession();
}

// Writing a note isn't time in the process, so the clock waits while it's open.
function openNote() {
  if (!live || sessionUi.noteOpen) return;
  sessionUi.noteOpen = true;
  sessionUi.notePaused = !isPaused();
  if (sessionUi.notePaused) pause('');
  renderSession();
  const t = $('s-note-text');
  t.value = live.notes || '';
  // Still inside the tap, so iOS will bring the keyboard up.
  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);
}

function closeNote() {
  if (!sessionUi.noteOpen) return;
  live.notes = $('s-note-text').value;
  $('s-note-text').blur();
  sessionUi.noteOpen = false;
  saveLive();
  if (sessionUi.notePaused) resume();
  else renderSession();
  sessionUi.notePaused = false;
}

function finishSession(endedEarly) {
  clearInterval(tickTimer);
  tickTimer = null;
  const s = live.state;
  const now = Date.now();
  const activeMs = live.activeMs + (live.runningSince === null ? 0 : now - live.runningSince);
  const record = {
    id: uid('s'),
    ladderId: live.ladderId,
    ladderName: live.ladderName,
    startedAt: new Date(live.startedAt).toISOString(),
    endedAt: new Date(now).toISOString(),
    plannedSec: Math.round(live.plannedMs / 1000),
    actualSec: Math.round(activeMs / 1000),
    endedEarly,
    target: s.target,
    reps: s.reps,
    yes: s.yes,
    yesRate: s.reps ? Math.round(s.yes / s.reps * 1000) / 1000 : 0,
    furthestRung: s.furthest + 1,
    rungCount: s.rungCount,
    topCleared: s.topCleared,
    consolidation: s.consolidation,
    notes: (live.notes || '').trim(),
    rungs: live.rungs.map((r, i) => ({ id: r.id, name: r.name, attempts: s.attempts[i], misses: s.misses[i] })),
  };
  // A session with no answers and no notes has nothing in it worth keeping.
  const saved = record.reps > 0 || !!record.notes;
  if (saved) {
    data.sessions.push(record);
    saveData();
  }
  view.summary = { record, saved, minutes: live.plannedMs / 60000 };
  live = null;
  clearLive();
  keepAwake(false);
  renderSummary();
  show('summary');
}

function renderSession() {
  if (!live) return;
  const s = live.state;
  const rung = live.rungs[s.rung];
  const paused = isPaused();
  $('screen-session').classList.toggle('time-up', live.timeUp);

  $('s-pos').textContent = sessionUi.hint || `Rung ${s.rung + 1} of ${s.rungCount}`;
  $('s-name').textContent = rungLabel(rung.name, s.rung);
  $('s-intent').textContent = rung.intention;
  $('s-intent').hidden = !rung.intention;
  $('s-streak-num').textContent = s.streak;
  const need = LadderLogic.repsToClimb(s);
  $('s-streak-of').textContent = LadderLogic.isConsolidating(s) ? 'clean · top rung cleared'
    : need < s.target ? `/ ${need} · climbing back` : `/ ${need}`;

  // A new rung slides in, so a changed name and intention get noticed before
  // the next rep. The direction says which way the ladder went.
  if (sessionUi.shownRung !== null && sessionUi.shownRung !== s.rung) {
    const block = $('s-rung');
    block.classList.remove('moved-up', 'moved-down');
    void block.offsetWidth;    // restart the animation
    block.classList.add(s.rung > sessionUi.shownRung ? 'moved-up' : 'moved-down');
  }
  sessionUi.shownRung = s.rung;

  $('s-step-down').disabled = s.rung === 0;
  $('s-undo').disabled = s.past.length === 0;
  $('s-pause').textContent = paused ? 'Resume' : 'Pause';

  $('s-end-cover').hidden = !sessionUi.confirmingEnd;
  $('s-end-note').textContent = s.reps
    ? `${plural(s.reps, 'rep')} so far. They'll be saved to History.`
    : "Nothing answered yet, so there's nothing to save.";
  $('s-pause-cover').hidden = !paused || sessionUi.confirmingEnd || sessionUi.noteOpen;
  $('s-note-sheet').hidden = !sessionUi.noteOpen;
  $('s-note').disabled = sessionUi.confirmingEnd;
  $('s-pause-note').textContent = sessionUi.pauseNote;
  $('s-pause-note').hidden = !sessionUi.pauseNote;
  paintTime();
}

function paintTime() {
  const label = live.timeUp
    ? 'Last rep'
    : fmtClock(Math.ceil(Math.max(0, live.plannedMs - elapsedMs()) / 1000));
  const el = $('s-time');
  if (el.textContent !== label) el.textContent = label;
}

function flash(id) {
  const b = $(id);
  b.classList.add('flash');
  setTimeout(() => b.classList.remove('flash'), 160);
}

// ─── Session: swiping between rungs ───────────────────────────────────────────
//
// A quick vertical swipe anywhere on the session screen: down steps down a
// rung, up steps back up to one already earned. The tap the swipe ends on is
// swallowed so it doesn't also answer. A swipe up that isn't allowed says why
// for a moment, in place of the rung count.

const SWIPE_MIN_PX = 70;
const SWIPE_MAX_MS = 700;
let swipe = null;

function onSwipeStart(e) {
  if (e.touches.length !== 1 || sessionUi.noteOpen || sessionUi.confirmingEnd) { swipe = null; return; }
  const t = e.touches[0];
  swipe = { x: t.clientX, y: t.clientY, at: Date.now() };
}

function onSwipeEnd(e) {
  if (!swipe || !live) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  const quick = Date.now() - swipe.at < SWIPE_MAX_MS;
  swipe = null;
  if (!quick || Math.abs(dy) < SWIPE_MIN_PX || Math.abs(dy) < Math.abs(dx) * 1.5) return;
  e.preventDefault();
  sessionUi.swipedAt = performance.now();
  swipeStep(dy > 0 ? 'STEP_DOWN' : 'STEP_UP');
}

function swipeStep(type) {
  const s = live.state;
  if (type === 'STEP_UP' && !LadderLogic.canStepUp(s)) {
    sessionHint(!s.freeReturn ? 'Only a full streak climbs on this ladder'
      : s.rung === s.rungCount - 1 ? 'Already on the top rung'
      : `Rung ${s.rung + 2} isn't earned yet`);
    return;
  }
  sessionAction(type);
}

function sessionHint(msg) {
  clearTimeout(sessionUi.hintTimer);
  sessionUi.hint = msg;
  renderSession();
  sessionUi.hintTimer = setTimeout(() => { sessionUi.hint = ''; if (live) renderSession(); }, 1600);
}

// ─── Session: end tone ────────────────────────────────────────────────────────
//
// iOS only lets a page make sound from an AudioContext started inside a tap.
// unlockAudio() runs in every session tap — Start, Run again, Resume and each
// answer — so the context is still running when time runs out with nobody
// touching the screen. Like all Web Audio on iOS, the tone is silenced by the
// ring/silent switch.

let audioCtx = null;

function unlockAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      // A one-sample silent buffer played inside the tap is what actually
      // opens the output on older iOS.
      const src = audioCtx.createBufferSource();
      src.buffer = audioCtx.createBuffer(1, 1, 22050);
      src.connect(audioCtx.destination);
      src.start(0);
    }
    if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  } catch (e) {}
}

// A kazoo fanfare, da-da-da-daaa, then a party horn. The output hardware
// sleeps after a few seconds of silence and swallows the start of whatever
// wakes it, so a breath of inaudible noise goes first and the tune follows it in.
function playEndTone() {
  const ctx = audioCtx;
  if (!ctx) return;
  try {
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    const t0 = ctx.currentTime + 0.3;
    wakeOutput(ctx, t0 - 0.3);
    const out = ctx.createGain();
    out.gain.value = 0.8;
    out.connect(ctx.destination);
    const kazoo = { type: 'sawtooth', peak: 0.5, attack: 0.02, vib: [6, 6], band: [1100, 3], out };
    [[0, 392, 0.14], [0.17, 392, 0.14], [0.34, 392, 0.14], [0.51, 523.25, 0.6]].forEach(([at, f, dur]) => {   // G G G C
      voice(ctx, t0 + at, { ...kazoo, pitch: [[0, f * 0.97], [0.04, f]], dur });
    });
    voice(ctx, t0 + 1.3, {
      type: 'sawtooth', peak: 0.45, attack: 0.03, band: [1500, 2], vib: [28, 25], out,
      pitch: [[0, 350], [0.25, 700], [0.7, 690]], dur: 0.75,
    });
  } catch (e) {}
}

// One synthesised voice, the building block of the silly sounds.
//   pitch  [[seconds from t, Hz], …]: starts at the first, glides through the rest
//   dur    how long it lasts; with `decay` it fades from the attack instead of
//          holding and cutting off
//   vib    [rate Hz, depth Hz, depth at the end]: a wobble on the pitch
//   band   [Hz, Q]: a band-pass filter, for buzzy and nasal sounds
function voice(ctx, t, { type = 'sine', pitch, dur, peak = 0.3, attack = 0.005, decay, vib, band, out = ctx.destination }) {
  const osc = ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(pitch[0][1], t);
  pitch.slice(1).forEach(([at, f]) => osc.frequency.exponentialRampToValueAtTime(f, t + at));
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  if (decay) {
    g.gain.setTargetAtTime(0, t + attack, decay);
  } else {
    g.gain.setValueAtTime(peak, t + Math.max(attack, dur - 0.03));
    g.gain.linearRampToValueAtTime(0, t + dur);
  }
  let node = osc;
  if (band) {
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = band[0];
    f.Q.value = band[1];
    osc.connect(f);
    node = f;
  }
  node.connect(g);
  g.connect(out);
  const stop = t + dur + 0.05;
  if (vib) {
    const lfo = ctx.createOscillator();
    const depth = ctx.createGain();
    lfo.frequency.value = vib[0];
    depth.gain.setValueAtTime(vib[1], t);
    if (vib[2]) depth.gain.exponentialRampToValueAtTime(vib[2], t + dur);
    lfo.connect(depth);
    depth.connect(osc.frequency);
    lfo.start(t);
    lfo.stop(stop);
  }
  osc.start(t);
  osc.stop(stop);
}

// The silly sounds a clean rep plays, one picked at random each time.
const YES_SOUNDS = {
  boing: (ctx, t) => voice(ctx, t, {
    type: 'triangle', peak: 0.4, decay: 0.12, dur: 0.6, vib: [20, 70, 4],
    pitch: [[0, 140], [0.12, 420], [0.45, 300]],
  }),
  bloop: (ctx, t) => voice(ctx, t, { peak: 0.4, decay: 0.05, dur: 0.25, pitch: [[0, 260], [0.1, 900]] }),
  quack: (ctx, t) => voice(ctx, t, {
    type: 'sawtooth', peak: 0.7, attack: 0.01, dur: 0.16, band: [1300, 5],
    pitch: [[0, 620], [0.16, 420]],
  }),
  squeak: (ctx, t) => {
    // A rubber duck: squeezed, then let go.
    const toy = { type: 'square', peak: 0.12, attack: 0.01, band: [2400, 4] };
    voice(ctx, t, { ...toy, dur: 0.12, pitch: [[0, 1700], [0.08, 2500], [0.12, 2200]] });
    voice(ctx, t + 0.16, { ...toy, dur: 0.1, pitch: [[0, 2300], [0.1, 1600]] });
  },
  pew: (ctx, t) => voice(ctx, t, { type: 'square', peak: 0.12, decay: 0.08, dur: 0.3, pitch: [[0, 1600], [0.25, 140]] }),
  honk: (ctx, t) => voice(ctx, t, {
    type: 'sawtooth', peak: 0.6, attack: 0.02, dur: 0.32, vib: [7, 8], band: [900, 2],
    pitch: [[0, 240], [0.06, 270]],
  }),
  cuckoo: (ctx, t) => {
    voice(ctx, t, { peak: 0.35, attack: 0.01, dur: 0.16, pitch: [[0, 784]] });
    voice(ctx, t + 0.2, { peak: 0.35, attack: 0.01, dur: 0.24, pitch: [[0, 622]] });
  },
  doink: (ctx, t) => voice(ctx, t, {
    type: 'triangle', peak: 0.4, decay: 0.1, dur: 0.4, vib: [30, 40, 2],
    pitch: [[0, 900], [0.2, 220]],
  }),
  coin: (ctx, t) => {
    voice(ctx, t, { type: 'square', peak: 0.1, dur: 0.07, pitch: [[0, 988]] });
    voice(ctx, t + 0.07, { type: 'square', peak: 0.1, decay: 0.12, dur: 0.4, pitch: [[0, 1319]] });
  },
  hiccup: (ctx, t) => voice(ctx, t, { type: 'triangle', peak: 0.45, attack: 0.003, decay: 0.03, dur: 0.15, pitch: [[0, 500], [0.04, 1400]] }),
};

// A fart: a low buzz whose pitch and loudness flutter at random every few
// milliseconds, through a resonant low-pass so it's more trouser than trumpet.
//   from, to  the buzz's pitch at the start and end, Hz
//   tone      the low-pass cutoff: higher is squeakier
//   flutter   how far the pitch wanders, as a fraction of it
function fart(ctx, t, { dur, from, to, peak = 0.5, tone = 500, flutter = 0.25 }) {
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  const f = ctx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = tone;
  f.Q.value = 6;
  const g = ctx.createGain();
  const steps = Math.max(2, Math.round(dur / 0.018));
  g.gain.setValueAtTime(0, t);
  for (let i = 0; i <= steps; i++) {
    const at = t + dur * i / steps;
    const pitch = from * Math.pow(to / from, i / steps);
    osc.frequency.setValueAtTime(pitch * (1 + (Math.random() * 2 - 1) * flutter), at);
    const shape = Math.min(1, i / 2) * (1 - Math.pow(i / steps, 3));    // quick in, trailing off
    g.gain.linearRampToValueAtTime(peak * shape * (0.6 + Math.random() * 0.4), at);
  }
  g.gain.linearRampToValueAtTime(0, t + dur + 0.02);
  osc.connect(f);
  f.connect(g);
  g.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

// A burst of noise through a filter whose cutoff glides from `freq` to `freqTo`.
function noise(ctx, t, { dur, peak, freq, freqTo = freq, Q = 1, decay }) {
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = 'lowpass';
  f.Q.value = Q;
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(peak, t);
  g.gain.setTargetAtTime(0, t, decay);
  src.connect(f);
  f.connect(g);
  g.connect(ctx.destination);
  src.start(t);
}

// The sounds a miss plays: daft rather than mocking, so a No is easy to own
// up to. Mostly farts.
const MISS_SOUNDS = {
  bwomp: (ctx, t) => {
    const horn = { type: 'sawtooth', peak: 0.28, attack: 0.03, band: [500, 1.2], vib: [5, 3] };
    voice(ctx, t, { ...horn, dur: 0.2, pitch: [[0, 233], [0.2, 220]] });
    voice(ctx, t + 0.24, { ...horn, dur: 0.42, pitch: [[0, 208], [0.42, 175]] });
  },
  pfft: (ctx, t) => fart(ctx, t, { dur: 0.22, from: 120, to: 90, tone: 650 }),
  trump: (ctx, t) => fart(ctx, t, { dur: 0.9, from: 95, to: 55, tone: 450, flutter: 0.35, peak: 0.6 }),
  squeaker: (ctx, t) => fart(ctx, t, { dur: 0.45, from: 290, to: 200, tone: 1500, flutter: 0.15, peak: 0.35 }),
  stutter: (ctx, t) => [130, 115, 100].forEach((f, i) =>
    fart(ctx, t + i * 0.13, { dur: 0.09, from: f, to: f * 0.9, tone: 600 })),
  question: (ctx, t) => fart(ctx, t, { dur: 0.55, from: 80, to: 170, tone: 700, flutter: 0.2 }),   // ends on the way up, like a question
  raspberry: (ctx, t) => voice(ctx, t, {
    type: 'sawtooth', peak: 0.55, attack: 0.02, dur: 0.35, vib: [35, 50], band: [700, 1.5],
    pitch: [[0, 110], [0.35, 90]],
  }),
  trombone: (ctx, t) => {
    // Wah, wah, wah, waaah.
    const slide = { type: 'sawtooth', peak: 0.35, attack: 0.03, band: [700, 1.5] };
    [293.7, 277.2, 261.6].forEach((f, i) => voice(ctx, t + i * 0.22, { ...slide, dur: 0.18, pitch: [[0, f], [0.18, f * 0.97]] }));
    voice(ctx, t + 0.66, { ...slide, dur: 0.6, vib: [6, 8], pitch: [[0, 246.9], [0.6, 233]] });
  },
  deflate: (ctx, t) => voice(ctx, t, {
    type: 'sawtooth', peak: 0.3, attack: 0.02, dur: 0.7, vib: [18, 60], band: [1200, 3],
    pitch: [[0, 900], [0.7, 250]],
  }),
  'uh-oh': (ctx, t) => {
    const v = { type: 'sawtooth', peak: 0.4, attack: 0.03, band: [800, 2] };
    voice(ctx, t, { ...v, dur: 0.14, pitch: [[0, 392]] });
    voice(ctx, t + 0.2, { ...v, dur: 0.28, pitch: [[0, 311], [0.28, 300]] });
  },
  splat: (ctx, t) => {
    noise(ctx, t, { dur: 0.3, peak: 0.6, freq: 1800, freqTo: 250, decay: 0.06 });
    voice(ctx, t, { peak: 0.4, attack: 0.003, decay: 0.05, dur: 0.2, pitch: [[0, 140], [0.15, 50]] });
  },
  'slide down': (ctx, t) => voice(ctx, t, { peak: 0.3, attack: 0.02, dur: 0.5, vib: [6, 15], pitch: [[0, 1500], [0.5, 250]] }),
};

// Picks at random from a set of sounds, but never one of the last three: a
// run of the same sound stops being funny.
function soundPicker(sounds) {
  const names = Object.keys(sounds);
  let recent = [];
  return () => {
    const ctx = audioCtx;
    if (!ctx) return;
    try {
      const choices = names.filter(n => !recent.includes(n));
      const name = choices[Math.floor(Math.random() * choices.length)];
      recent = recent.concat(name).slice(-3);
      sounds[name](ctx, ctx.currentTime + 0.005);
    } catch (e) {}
  };
}

const playYesSound = soundPicker(YES_SOUNDS);
const playMissSound = soundPicker(MISS_SOUNDS);

// A slide whistle up for earning a rung: a pure tone gliding up two octaves,
// with a little warble, ending in a quick toot at the top.
function playClimbSound() {
  const ctx = audioCtx;
  if (!ctx) return;
  try {
    const t = ctx.currentTime + 0.005;
    const top = t + 0.5;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.exponentialRampToValueAtTime(1760, top);
    const lfo = ctx.createOscillator();
    const depth = ctx.createGain();
    lfo.frequency.value = 7;
    depth.gain.value = 18;
    lfo.connect(depth);
    depth.connect(osc.frequency);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.28, t + 0.04);
    g.gain.setValueAtTime(0.28, top);
    g.gain.linearRampToValueAtTime(0.06, top + 0.04);   // a breath between glide and toot
    g.gain.linearRampToValueAtTime(0.3, top + 0.08);
    g.gain.setTargetAtTime(0, top + 0.16, 0.05);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t);
    lfo.start(t);
    osc.stop(top + 0.5);
    lfo.stop(top + 0.5);
  } catch (e) {}
}

function wakeOutput(ctx, t) {
  const len = Math.floor(ctx.sampleRate * 0.6);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const g = ctx.createGain();
  g.gain.value = 0.0001;    // about -80 dB: inaudible, but not the digital zero a device may skip
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(g);
  g.connect(ctx.destination);
  src.start(t);
}

// ─── Session: screen wake lock ────────────────────────────────────────────────
//
// Held for the whole session, paused or not. The system takes the lock back
// whenever the page stops being frontmost, and on its own for calls and
// notifications, and never hands it back unasked. So hold the intention
// (`wantAwake`) and keep re-asking: on the lock's release, on
// visibilitychange, on every answer, and every 30 s from the session tick.
// Unsupported or refused (Low Power Mode refuses it on iOS): carry on
// silently; the session works without it.

let wakeLock = null;
let wakePending = false;
let wantAwake = false;

async function acquireWakeLock() {
  if (!wantAwake || wakeLock || wakePending || !('wakeLock' in navigator)) return;
  if (document.visibilityState !== 'visible') return;    // the request would only be refused
  wakePending = true;
  try {
    const lock = await navigator.wakeLock.request('screen');
    if (!wantAwake) { lock.release().catch(() => {}); return; }
    wakeLock = lock;
    lock.addEventListener('release', () => {
      if (wakeLock === lock) wakeLock = null;
      if (wantAwake) setTimeout(acquireWakeLock, 300);
    });
  } catch (e) {
    // Unsupported, refused or interrupted: try again at the next chance.
  } finally {
    wakePending = false;
  }
}

function keepAwake(on) {
  wantAwake = on;
  if (on) { acquireWakeLock(); return; }
  const lock = wakeLock;
  wakeLock = null;
  if (lock) lock.release().catch(() => {});
}

// ─── Summary ──────────────────────────────────────────────────────────────────

function renderSummary() {
  const { record: r, saved } = view.summary;
  const reached = r.rungs[r.furthestRung - 1];
  const missed = mostMissed(r.rungs);
  $('sum-kicker').textContent = r.endedEarly ? 'Ended early' : 'Session complete';
  $('sum-title').textContent = r.ladderName;
  $('sum-sub').textContent = `${fmtMinutes(r.plannedSec)} planned · ${fmtDay(r.startedAt)}, ${fmtTimeOfDay(r.startedAt)}`;
  $('sum-stats').innerHTML = [
    statHtml('Time spent', fmtClock(r.actualSec)),
    statHtml('Total reps', r.reps),
    statHtml('Yes rate', r.reps ? pct(r.yesRate) : '–', r.reps ? `${r.yes} of ${r.reps}` : ''),
    statHtml('Furthest rung', `${r.furthestRung} of ${r.rungCount}`, r.topCleared ? 'top rung cleared' : ''),
    statHtml('Reached', rungLabel(reached.name, r.furthestRung - 1),
      r.consolidation ? `${plural(r.consolidation, 'consolidation rep')} on the top rung` : '', true),
    statHtml('Most misses',
      missed ? missed.list.map(m => `Rung ${m.n} · ${rungLabel(m.name, m.n - 1)}`).join(' / ') : 'No misses',
      missed ? `${plural(missed.count, 'miss', 'misses')}${missed.list.length > 1 ? ' each' : ''}` : '', true),
  ].join('');
  $('sum-note').textContent = saved ? '' : 'No reps were answered, so this session wasn’t saved.';
  $('sum-note').hidden = saved;
  $('sum-notes').hidden = !saved;
  $('sum-notes-text').value = r.notes;
  autosize($('sum-notes-text'));
}

// Notes typed on the summary go straight into the saved session.
function onSummaryNotes(e) {
  const r = view.summary && view.summary.record;
  if (!r || !view.summary.saved) return;
  r.notes = e.target.value;
  autosize(e.target);
  saveSoon();
}

function statHtml(label, value, detail, full) {
  return `
    <div class="stat${full ? ' full' : ''}">
      <div class="label">${esc(label)}</div>
      <div class="stat-value">${esc(value)}</div>
      ${detail ? `<div class="stat-detail">${esc(detail)}</div>` : ''}
    </div>`;
}

function leaveSummary() {
  const r = view.summary && view.summary.record;
  if (r) r.notes = r.notes.trim();
  flushSave();
}

function runAgain() {
  leaveSummary();
  const { record, minutes } = view.summary;
  startSession(record.ladderId, minutes);
}

// ─── History ──────────────────────────────────────────────────────────────────
//
// One ladder at a time: an overview that answers "where do I stall?", then the
// sessions, newest first, each opening to its per-rung attempts and misses.
// Rungs are matched across sessions by id, so renaming or reordering a rung
// doesn't split its history.

function openHistory(ladderId, from) {
  view.historyBack = from;
  view.historyLadderId = ladderId;
  renderHistory();
  show('history');
}

// Every current ladder, plus deleted ones that still have sessions.
function historyGroups() {
  const groups = new Map();
  data.ladders.forEach(l => groups.set(l.id, { id: l.id, name: l.name, ladder: l, sessions: [] }));
  data.sessions.forEach(s => {
    if (!groups.has(s.ladderId)) groups.set(s.ladderId, { id: s.ladderId, name: s.ladderName, ladder: null, sessions: [] });
    const g = groups.get(s.ladderId);
    if (!g.ladder) g.name = s.ladderName;
    g.sessions.push(s);
  });
  return [...groups.values()].filter(g => g.ladder || g.sessions.length);
}

function renderHistory() {
  const groups = historyGroups();
  const select = $('h-ladder');
  if (!data.sessions.length) {
    select.hidden = true;
    $('h-body').innerHTML = '<p class="empty">No sessions yet. Every session you finish or end shows up here.</p>';
    return;
  }
  if (!groups.some(g => g.id === view.historyLadderId)) {
    view.historyLadderId = data.sessions[data.sessions.length - 1].ladderId;
  }
  select.hidden = false;
  select.innerHTML = groups.map(g => `
    <option value="${esc(g.id)}"${g.id === view.historyLadderId ? ' selected' : ''}>${esc(g.name)}${g.ladder ? '' : ' (deleted)'} — ${plural(g.sessions.length, 'session')}</option>`).join('');
  const g = groups.find(x => x.id === view.historyLadderId);
  $('h-body').innerHTML = g.sessions.length
    ? overviewHtml(g) + `<ul class="h-list">${g.sessions.slice().reverse().map(sessionItemHtml).join('')}</ul>`
    : '<p class="empty">No sessions on this ladder yet.</p>';
}

function overviewHtml(g) {
  const ss = g.sessions;    // oldest first
  const recent = ss.slice(-12).reverse().map(s => s.furthestRung + (s.topCleared ? '✓' : '')).join(' · ');
  const stall = topTally(ss, s => s.topCleared ? [] : [[s.rungs[s.furthestRung - 1], s.furthestRung - 1, 1]]);
  const missed = topTally(ss, s => s.rungs.map((r, i) => [r, i, r.misses]));
  return `
    <dl class="h-overview">
      <div>
        <dt class="label">Furthest rung, newest first</dt>
        <dd class="nums">${recent}${ss.length > 12 ? ' …' : ''} <span class="muted">of ${ss[ss.length - 1].rungCount}</span></dd>
      </div>
      ${stall ? `<div>
        <dt class="label">Stalls most often at</dt>
        <dd>${esc(rungRef(g, stall))} <span class="muted">— ${stall.count} of ${plural(ss.length, 'session')}</span></dd>
      </div>` : ''}
      ${missed ? `<div>
        <dt class="label">Most misses overall</dt>
        <dd>${esc(rungRef(g, missed))} <span class="muted">— ${plural(missed.count, 'miss', 'misses')}</span></dd>
      </div>` : ''}
    </dl>`;
}

// Adds up per-rung amounts across sessions (keyed by rung id) and returns the
// biggest, labelled with the rung's newest name and position; null if none.
// `pick` gives each session's [rung, index, amount] entries.
function topTally(sessions, pick) {
  const tally = new Map();
  sessions.forEach(s => pick(s).forEach(([r, i, amount]) => {
    if (!amount) return;
    const key = r.id || `${i}:${r.name}`;
    const t = tally.get(key) || { id: r.id, count: 0 };
    t.count += amount;
    t.name = r.name;
    t.index = i;
    tally.set(key, t);
  }));
  let best = null;
  tally.forEach(t => { if (!best || t.count > best.count) best = t; });
  return best;
}

// "Rung 3 · name", using the ladder as it is now when the rung still exists.
function rungRef(g, t) {
  const i = g.ladder && t.id ? g.ladder.rungs.findIndex(r => r.id === t.id) : -1;
  return i >= 0
    ? `Rung ${i + 1} · ${rungLabel(g.ladder.rungs[i].name, i)}`
    : `Rung ${t.index + 1} · ${rungLabel(t.name, t.index)}`;
}

function sessionItemHtml(s) {
  const stalledAt = s.topCleared ? -1 : s.furthestRung - 1;
  const pips = s.rungCount > 12 ? '' : `<span class="pips" aria-hidden="true">${
    s.rungs.map((r, i) => `<i class="${i < s.furthestRung ? (s.topCleared && i === s.rungCount - 1 ? 'on top' : 'on') : ''}"></i>`).join('')
  }</span>`;
  const missed = mostMissed(s.rungs);
  const sub = [
    `${fmtClock(s.actualSec)} of ${fmtMinutes(s.plannedSec)}`,
    plural(s.reps, 'rep'),
    `${pct(s.yesRate)} yes`,
    s.endedEarly ? 'ended early' : '',
  ].filter(Boolean).join(' · ');
  const rows = s.rungs.map((r, i) => `
    <li${i === stalledAt ? ' class="stall"' : ''}>
      <span class="n">${i + 1}</span>
      <span>${esc(rungLabel(r.name, i))}</span>
      <span class="c">${r.attempts ? `${plural(r.attempts, 'rep')} · ${plural(r.misses, 'miss', 'misses')}` : i < s.furthestRung ? '0 reps' : 'not reached'}</span>
    </li>`).reverse().join('');
  return `
    <li class="h-item"><details>
      <summary>
        <div class="h-top">
          <span class="h-date">${esc(fmtDay(s.startedAt))} · ${esc(fmtTimeOfDay(s.startedAt))}</span>
          <span class="h-reach">${pips}<span>${s.furthestRung}/${s.rungCount}${s.topCleared ? ' ✓' : ''}</span></span>
        </div>
        <div class="h-sub">${sub}</div>
        ${missed ? `<div class="h-sub">Most misses: rung ${missed.list.map(m => m.n).join(' & ')} (${missed.count})</div>` : ''}
        ${s.notes ? '<div class="h-sub">Has notes</div>' : ''}
      </summary>
      <div class="h-detail">
        <ul class="h-rungs">${rows}</ul>
        ${s.notes ? `<p class="h-notes">${esc(s.notes)}</p>` : ''}
        <button class="btn small danger" data-action="delete-session" data-id="${esc(s.id)}">Delete this session</button>
      </div>
    </details></li>`;
}

function historyBack() {
  if (view.historyBack === 'ladder' && currentLadder()) openLadder(view.ladderId, false);
  else goHome();
}

function deleteSession(btn) {
  const s = data.sessions.find(x => x.id === btn.dataset.id);
  if (!s || !confirm(`Delete the session from ${fmtDay(s.startedAt)}, ${fmtTimeOfDay(s.startedAt)}?`)) return;
  data.sessions = data.sessions.filter(x => x !== s);
  saveData();
  renderHistory();
}

// ─── Backup: export and import ────────────────────────────────────────────────

function exportData() {
  flushSave();
  const name = `learning-ladder-${new Date().toISOString().slice(0, 10)}.json`;
  const json = JSON.stringify({ app: 'Learning Ladder', exportedAt: new Date().toISOString(), ...data }, null, 2);
  // On a phone the share sheet is the dependable way out (Save to Files,
  // AirDrop, Mail). Everywhere else, a plain download.
  try {
    const file = new File([json], name, { type: 'application/json' });
    const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(err => {
        if (!err || err.name !== 'AbortError') download(json, name);
      });
      return;
    }
  } catch (e) {}
  download(json, name);
}

function download(json, name) {
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function importData(file) {
  const reader = new FileReader();
  reader.onerror = () => alert('That file couldn’t be read.');
  reader.onload = () => {
    let incoming;
    try {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { throw new Error("it isn't a JSON file"); }
      incoming = normalise(migrate(parsed));
      if (!incoming.ladders.length && !incoming.sessions.length) throw new Error('it has no ladders or sessions in it');
    } catch (e) {
      alert(`That file can't be imported: ${e.message}.`);
      return;
    }
    const ok = confirm(
      'Replace everything on this device with this backup?\n\n' +
      `In the backup: ${plural(incoming.ladders.length, 'ladder')}, ${plural(incoming.sessions.length, 'session')}\n` +
      `Here now: ${plural(data.ladders.length, 'ladder')}, ${plural(data.sessions.length, 'session')}`);
    if (!ok) return;
    data = incoming;
    saveData();
    renderHome();
    notice(`Imported ${plural(data.ladders.length, 'ladder')} and ${plural(data.sessions.length, 'session')}.`, 6000);
  };
  reader.readAsText(file);
}

// ─── Theme ────────────────────────────────────────────────────────────────────
//
// Dark unless chosen otherwise. A per-device preference, so it lives outside
// the backed-up data.

const lightQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;

function themePref() {
  try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; }
}

function applyTheme() {
  const pref = themePref();
  const light = pref === 'light' || (pref === 'auto' && !!lightQuery && lightQuery.matches);
  document.documentElement.setAttribute('data-scheme', light ? 'light' : 'dark');
  document.querySelector('meta[name="theme-color"]').content = light ? '#f5f4f0' : '#0c0e10';
}

function setTheme(pref) {
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
  applyTheme();
  renderThemeChoice();
}

function renderThemeChoice() {
  const pref = themePref();
  document.querySelectorAll('[data-action="theme"]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.value === pref));
  });
}

// ─── Home screen manifest ─────────────────────────────────────────────────────
//
// iOS takes its home-screen name, icon and full-screen mode from the tags in
// <head>. The manifest covers everything else (Android, desktop installs). It's
// built here to reuse those same icons, and handed over as a data: URI so there
// is still only one file. A data: manifest can't hold relative URLs, so
// start_url is absolute, and left out when the page is opened from disk.

function linkManifest() {
  const href = selector => (document.querySelector(selector) || {}).href;
  const manifest = {
    name: 'Learning Ladder',
    short_name: 'Ladder',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0c0e10',
    theme_color: '#0c0e10',
    icons: [
      { src: href('link[rel="apple-touch-icon"]'), sizes: '180x180', type: 'image/png' },
      { src: href('link[rel="icon"]'), sizes: 'any', type: 'image/svg+xml' },
    ],
  };
  if (/^https?:$/.test(location.protocol)) manifest.start_url = location.origin + location.pathname;
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
}

// ─── Wiring ───────────────────────────────────────────────────────────────────
//
// Buttons carry a data-action; one listener dispatches them all.

const actions = {
  'history': () => openHistory(null, 'home'),
  'open-ladder': b => openLadder(b.dataset.id, false),
  'new-ladder': newLadder,
  'export': exportData,
  'import': () => $('import-file').click(),
  'theme': b => setTheme(b.dataset.value),

  'ladder-back': () => { if (view.editing) finishEditing(); goHome(); },
  'toggle-edit': toggleEdit,
  'ladder-history': () => openHistory(view.ladderId, 'ladder'),
  'add-rung': addRung,
  'rung-up': b => moveRung(b, +1),
  'rung-down': b => moveRung(b, -1),
  'rung-delete': deleteRung,
  'duplicate-ladder': duplicateLadder,
  'delete-ladder': deleteLadder,
  'timer': b => chooseTimer(b.dataset.value),
  'start': () => startSession(view.ladderId, chosenMinutes()),

  'yes': () => answer('YES'),
  'no': () => answer('NO'),
  'undo': () => control(() => sessionAction('UNDO')),
  'step-down': () => control(() => sessionAction('STEP_DOWN')),
  'pause': () => control(() => (isPaused() ? resume() : pause(''))),
  'resume': resume,
  'note': () => control(openNote),
  'note-done': closeNote,
  'end': () => { closeNote(); sessionUi.confirmingEnd = true; renderSession(); },
  'end-cancel': () => { sessionUi.confirmingEnd = false; renderSession(); },
  'end-confirm': () => { if (live) finishSession(!live.timeUp); },

  'run-again': runAgain,
  'home': () => { leaveSummary(); goHome(); },
  'history-back': historyBack,
  'delete-session': deleteSession,
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const fn = actions[b.dataset.action];
  if (fn) fn(b, e);
});

$('ladder-body').addEventListener('input', onEditorInput);
$('ladder-body').addEventListener('change', onEditorChange);
$('ladder-body').addEventListener('keydown', onEditorKeydown);

$('custom-min').addEventListener('input', e => {
  const n = parseInt(e.target.value, 10);
  if (n >= 1 && n <= 180) { data.settings.customMinutes = n; saveSoon(); }
});
$('custom-min').addEventListener('change', e => {
  data.settings.customMinutes = clampInt(e.target.value, 1, 180, data.settings.customMinutes);
  e.target.value = data.settings.customMinutes;
  saveData();
});

$('screen-session').addEventListener('touchstart', onSwipeStart, { passive: true });
$('screen-session').addEventListener('touchend', onSwipeEnd, { passive: false });

$('s-note-text').addEventListener('input', e => {
  if (!live) return;
  live.notes = e.target.value;
  saveLive();
});
$('sum-notes-text').addEventListener('input', onSummaryNotes);

$('h-ladder').addEventListener('change', e => {
  view.historyLadderId = e.target.value;
  renderHistory();
});

$('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) importData(file);
});

// Keys for testing at a desk: Y / N answer, U undo, D step down, P pause,
// W writes a note, ↑ / ↓ as the swipes, Esc asks to end (or closes the note).
document.addEventListener('keydown', e => {
  if (view.screen !== 'session' || !live || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (sessionUi.noteOpen) {
    if (e.key === 'Escape') { closeNote(); e.preventDefault(); }
    return;
  }
  const key = e.key.toLowerCase();
  if (key === 'y') answer('YES');
  else if (key === 'n') answer('NO');
  else if (key === 'u') actions['undo']();
  else if (key === 'd') actions['step-down']();
  else if (key === 'p') actions['pause']();
  else if (key === 'w') actions['note']();
  else if (key === 'arrowdown') swipeStep('STEP_DOWN');
  else if (key === 'arrowup') swipeStep('STEP_UP');
  else if (key === 'escape') actions[sessionUi.confirmingEnd ? 'end-cancel' : 'end']();
  else return;
  e.preventDefault();
});

// Leaving the app mid-session pauses it: time away isn't time in the process,
// and iOS may throw the page away before it comes back.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    flushSave();
    if (live) pause('Paused while the app was in the background.');
  } else if (live) {
    acquireWakeLock();
  }
});
window.addEventListener('pagehide', () => {
  flushSave();
  if (live) {
    pause('Paused while the app was in the background.');
    saveLive();
  }
});

// iOS: :active styles only show with a touch listener present; pinch-zoom
// ignores the viewport tag, so block it during a session instead.
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('gesturestart', e => { if (view.screen === 'session') e.preventDefault(); });
$('screen-session').addEventListener('contextmenu', e => e.preventDefault());

if (lightQuery) {
  if (lightQuery.addEventListener) lightQuery.addEventListener('change', applyTheme);
  else if (lightQuery.addListener) lightQuery.addListener(applyTheme);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

data = loadData();
applyTheme();
linkManifest();
requestPersistence();

const unfinished = loadLive();
if (unfinished) {
  // The page went away mid-session without pausing (it was killed, or
  // crashed). Bank the time up to the last save and come back paused, so the
  // time away isn't counted as practice.
  live = unfinished;
  if (live.runningSince !== null) {
    live.activeMs += Math.max(0, (live.savedAt || live.runningSince) - live.runningSince);
    live.runningSince = null;
  }
  delete live.savedAt;
  enterSession('Picked up where you left off. The clock is paused.');
} else {
  goHome();
}
</script>
