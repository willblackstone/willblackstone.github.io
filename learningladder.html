<style>
  /* Dark by default and high contrast throughout: it lives on a music stand,
     in whatever light the room has. */
  :root {
    color-scheme: dark;
    --bg: #0c0e10;
    --surface: #15181b;
    --surface-2: #1f2327;
    --line: #2c3136;
    --text: #f2f1ed;
    --text-2: #b4bac1;
    --text-3: #7f8790;
    --accent: #8fd6a6;
    --warn: #f2c47e;
    --danger: #f29a9a;
    --yes-bg: #173d2a;
    --yes-line: #2f7a52;
    --yes-text: #e3f8ea;
    --no-bg: #3e2023;
    --no-line: #7d3f47;
    --no-text: #fce5e7;
    --press: rgba(255, 255, 255, 0.14);
    --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 12px;
    --radius-lg: 20px;
    --gutter-l: max(16px, env(safe-area-inset-left));
    --gutter-r: max(16px, env(safe-area-inset-right));
  }
  :root[data-scheme="light"] {
    color-scheme: light;
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-2: #eae8e3;
    --line: #d3d0c9;
    --text: #111315;
    --text-2: #3d434a;
    --text-3: #686e76;
    --accent: #1d7a46;
    --warn: #8a5a00;
    --danger: #b42318;
    --yes-bg: #d2eedc;
    --yes-line: #6dbb8d;
    --yes-text: #0b3a21;
    --no-bg: #f7dada;
    --no-line: #d79595;
    --no-text: #4f1414;
    --press: rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    background: var(--bg);
    touch-action: manipulation;
  }
  html.in-session, html.in-session body { overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.4;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  /* black-translucent is fixed when the app is added to the home screen, so
     the status bar text stays white. In the light theme, keep a dark band
     behind it. It only has height when running full-screen from the home
     screen. */
  :root[data-scheme="light"] body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top);
    background: #0c0e10;
    z-index: 50;
  }
  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  button:disabled { cursor: default; opacity: 0.35; }
  /* 16px or more, or iOS zooms the page on focus. */
  input, textarea, select { font: inherit; font-size: 17px; color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .screen {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 6px) var(--gutter-r) calc(env(safe-area-inset-bottom) + 28px) var(--gutter-l);
  }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; }
  .bar h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .bar.centred { display: grid; grid-template-columns: 1fr auto 1fr; }
  .bar-title { font-size: 18px; font-weight: 650; }
  .quiet {
    min-height: 48px; min-width: 48px; padding: 0 12px;
    border-radius: var(--radius);
    color: var(--text-2); font-size: 17px;
  }
  .quiet:active { background: var(--surface-2); }
  .quiet.back { margin-left: -12px; justify-self: start; }
  .quiet.edge-r { margin-right: -12px; }

  .label {
    font-size: 13px; font-weight: 650;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-3);
  }
  .opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .muted { color: var(--text-3); }
  .empty { color: var(--text-2); padding: 24px 4px; text-align: center; }

  .btn {
    min-height: 48px; padding: 0 18px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 17px; font-weight: 500;
  }
  .btn:active { background: var(--surface-2); }
  .btn.wide { width: 100%; }
  .btn.small { padding: 0 14px; font-size: 16px; }
  .btn.danger { color: var(--danger); }
  .btn.primary {
    min-height: 56px;
    background: var(--text); border-color: var(--text); color: var(--bg);
    font-size: 18px; font-weight: 650;
  }
  .btn.primary:active { opacity: 0.85; }

  .seg {
    display: flex; gap: 4px; padding: 4px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 8px;
    border-radius: 10px;
    color: var(--text-2); font-size: 16px;
  }
  .seg button[aria-pressed="true"] {
    background: var(--surface-2); color: var(--text); font-weight: 650;
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .tag {
    display: inline-block;
    font-size: 11px; font-weight: 700; font-style: normal;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--warn);
    border: 1px solid currentColor; border-radius: 6px;
    padding: 0 5px; line-height: 17px;
    vertical-align: 2px;
  }

  .notice {
    margin: 6px 0 10px; padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--warn); font-size: 15px;
  }

  /* ─── Ladders ─── */
  .cards { list-style: none; display: grid; gap: 10px; margin: 6px 0 14px; }
  .card {
    width: 100%; text-align: left;
    display: flex; flex-direction: column; gap: 3px;
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    background: var(--surface); border: 1px solid var(--line);
  }
  .card:active { background: var(--surface-2); }
  .card-title { font-size: 20px; font-weight: 650; }
  .card-focus { color: var(--text-2); font-size: 16px; }
  .card-meta { color: var(--text-3); font-size: 15px; }
  .home-foot {
    display: grid; gap: 14px;
    margin-top: 36px; padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .foot-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .foot-row .seg { flex: 0 1 240px; }
  .foot-btns { display: flex; gap: 8px; }
  .foot-note { color: var(--text-3); font-size: 14px; margin-top: -6px; }

  /* ─── One ladder: view, editor, start ─── */
  .ladder-screen { display: flex; flex-direction: column; padding-bottom: 0; }
  #ladder-body { flex: 1; padding-bottom: 24px; }
  .ladder-screen.editing #ladder-body { padding-bottom: calc(env(safe-area-inset-bottom) + 28px); }
  .ladder-head { margin: 2px 0 16px; }
  .ladder-title { font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
  .ladder-focus { color: var(--text-2); margin-top: 6px; }
  .ladder-rule { color: var(--text-3); font-size: 15px; margin-top: 8px; }
  .hint {
    margin: 0 0 12px; padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px dashed var(--line);
    color: var(--text-2); font-size: 15px;
  }
  .rung-list { list-style: none; margin-bottom: 8px; }
  .rung-row {
    display: grid; grid-template-columns: 40px 1fr; gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .rung-row:last-child { border-bottom: 0; }
  .rung-num {
    font-size: 22px; font-weight: 300; line-height: 1.1;
    color: var(--text-3); text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .rung-row.base .rung-num::after {
    content: 'start'; display: block;
    font-size: 10px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;
    margin-top: 3px;
  }
  .rung-name { font-size: 18px; font-weight: 600; line-height: 1.25; }
  .rung-intent { color: var(--text-2); font-size: 16px; margin-top: 3px; }
  .rung-intent.is-placeholder { color: var(--text-3); font-style: italic; }

  .dock {
    position: sticky; bottom: 0; z-index: 5;
    display: grid; gap: 10px;
    margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l));
    padding: 12px var(--gutter-r) calc(env(safe-area-inset-bottom) + 12px) var(--gutter-l);
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .custom-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text-2); }
  .custom-row input {
    width: 104px; min-height: 48px; text-align: center;
    border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  }

  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field.inline { grid-template-columns: 1fr 96px; align-items: center; gap: 12px; }
  .field input, .rung-card input, .rung-card textarea {
    width: 100%; min-height: 48px; padding: 11px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .field.inline input { text-align: center; }
  .field.inline.wide-ctl { grid-template-columns: 1fr auto; }
  .field select {
    min-height: 48px; padding: 0 12px;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface);
  }
  .field input[type="checkbox"] {
    width: 28px; height: 28px; min-height: 28px; margin: 10px;
    accent-color: var(--accent);
  }
  .rung-card input, .rung-card textarea { background: var(--bg); }
  textarea { display: block; resize: none; overflow: hidden; line-height: 1.35; }
  textarea.is-placeholder { color: var(--text-3); font-style: italic; }
  .rungs-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 26px 0 10px; }
  .rung-edit-list { list-style: none; display: grid; gap: 12px; }
  .rung-card {
    display: grid; gap: 8px; padding: 10px 12px 14px;
    border-radius: var(--radius-lg);
    background: var(--surface); border: 1px solid var(--line);
  }
  .rung-card-head { display: flex; align-items: center; justify-content: space-between; }
  .rung-tools { display: flex; margin-right: -8px; }
  .icon-btn {
    min-width: 48px; min-height: 48px;
    border-radius: var(--radius);
    color: var(--text-2); font-size: 20px;
  }
  .icon-btn:active { background: var(--surface-2); }
  .icon-btn.danger { color: var(--danger); font-size: 17px; }
  .intent-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-3); margin-top: 2px; }
  .editor-foot { display: grid; gap: 10px; margin-top: 28px; }

  /* ─── Session ───
     Deliberately sparse: where you are, what you're doing, the streak, the
     clock, and two answers big enough to hit with a trumpet in the other
     hand. The few other controls sit small and dim at the top, well away
     from where the answers are aimed. */
  .session {
    position: fixed; top: 0; left: 0; right: 0;
    height: 100vh;
    height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) var(--gutter-r) calc(env(safe-area-inset-bottom) + 14px) var(--gutter-l);
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .session > * { width: 100%; max-width: 560px; margin-left: auto; margin-right: auto; }
  .s-controls { display: flex; align-items: center; min-height: 52px; flex-shrink: 0; }
  .s-controls .spacer { flex: 1; }
  .s-ctl {
    min-height: 48px; min-width: 48px; padding: 0 11px;
    border-radius: var(--radius);
    color: var(--text-3); font-size: 16px;
  }
  .s-ctl:active { background: var(--surface-2); color: var(--text-2); }
  .s-ctl:first-child { margin-left: -11px; }
  .s-ctl:last-child { margin-right: -11px; }
  .s-main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .s-info { flex-shrink: 0; }
  .s-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--text-2); font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .s-time { font-size: 20px; color: var(--text); }
  .session.time-up .s-time { color: var(--warn); font-weight: 600; }
  .s-rung { padding-top: 10px; }
  .s-name {
    font-size: clamp(26px, 8vw, 38px); font-weight: 700;
    line-height: 1.12; letter-spacing: -0.015em;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
  }
  .s-intent {
    font-size: clamp(17px, 5.2vw, 22px); line-height: 1.32;
    color: var(--text-2); margin-top: 8px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
  }
  .s-rung.moved-up { animation: from-above 0.35s ease-out; }
  .s-rung.moved-down { animation: from-below 0.35s ease-out; }
  @keyframes from-above { from { opacity: 0; transform: translateY(-12px); } }
  @keyframes from-below { from { opacity: 0; transform: translateY(12px); } }
  .s-streak {
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 0 14px;
    font-variant-numeric: tabular-nums;
  }
  .s-streak-num { font-size: 46px; font-weight: 300; line-height: 1; }
  .s-streak-of { font-size: 20px; color: var(--text-2); }
  .s-answer { flex: 1; min-height: 220px; position: relative; display: flex; flex-direction: column; gap: 12px; }
  .answer {
    flex: 1; min-height: 0; width: 100%;
    border-radius: 24px; border: 2px solid;
    font-size: clamp(44px, 14vw, 68px); font-weight: 700; letter-spacing: 0.01em;
  }
  .answer.yes { background: var(--yes-bg); border-color: var(--yes-line); color: var(--yes-text); }
  .answer.no { background: var(--no-bg); border-color: var(--no-line); color: var(--no-text); }
  .answer:active, .answer.flash { box-shadow: inset 0 0 0 999px var(--press); }
  .cover {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    border-radius: 24px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .cover-title { font-size: 26px; font-weight: 700; }
  .cover-note { color: var(--text-2); max-width: 30ch; }
  .cover .btn { width: 100%; max-width: 340px; }
  .cover .btn.primary { min-height: 76px; font-size: 22px; }
  /* The note sits over the top of the screen, where the keyboard won't cover
     it. Typing needs selection back, which the session otherwise turns off. */
  .note-sheet {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; gap: 10px;
    padding-top: 6px;
    background: var(--bg);
  }
  .note-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .note-head .muted { font-size: 15px; }
  .note-sheet textarea, .sum-notes textarea {
    width: 100%; padding: 11px 13px;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface);
    -webkit-user-select: text; user-select: text;
    touch-action: auto;
  }
  .note-sheet textarea { flex: 0 1 40%; min-height: 120px; resize: none; overflow: auto; }
  .sum-notes { display: grid; gap: 6px; margin-top: 22px; }
  .sum-notes textarea { min-height: 120px; }
  @media (orientation: landscape) and (max-height: 540px) {
    .s-main { flex-direction: row; gap: 20px; }
    .s-info { flex: 1 1 0; overflow: hidden; }
    .s-answer { flex: 1 1 0; min-height: 0; }
    .s-name { font-size: 26px; }
    .s-intent { font-size: 17px; }
    .s-streak-num { font-size: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .s-rung.moved-up, .s-rung.moved-down { animation: none; }
  }

  /* ─── Summary ─── */
  .sum-head { margin: 18px 0 18px; }
  .sum-title { font-size: 28px; font-weight: 700; line-height: 1.15; margin-top: 6px; }
  .sum-sub { color: var(--text-2); margin-top: 4px; }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line);
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .stat { background: var(--surface); padding: 14px 16px; min-width: 0; }
  .stat.full { grid-column: 1 / -1; }
  .stat-value { font-size: 28px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat.full .stat-value { font-size: 19px; }
  .stat-detail { color: var(--text-2); font-size: 15px; margin-top: 3px; }
  .sum-note { color: var(--text-3); margin-top: 12px; font-size: 15px; }
  .sum-actions { display: grid; gap: 10px; margin-top: 22px; }
